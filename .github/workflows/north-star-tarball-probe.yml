# ⚠ **on: は workflow_dispatch のみ。** push / pull_request では走らない——毎 PR には
# 重すぎる（`pnpm pack` × PUBLISH_TARGETS 件、`npm install` の registry 依存）ため、
# リリース前などに人が明示的に起こす運用を想定している。
name: "北極星7項目・tarball install の一覧を印字する（段2。測るだけ。門にはしない。Issue #387 / ADR 0216 決定7）"

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: "pnpm pack → npm install → 段1と同じ probe ロジックを再実行する（段2）"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # ⛔ 実 API は使わない。probe 自体は DeterministicLLMProvider /
      # DeterministicEmbeddingProvider を直接 new するため、この2つの環境変数を probe が
      # 読むわけではないが、この workflow で何かのコード経路が provider 選択に
      # フォールバックしたとしても実 API へ向かわないよう、明示しておく（AGENTS.md）。
      MNEMORA_LLM: deterministic
      MNEMORA_EMBEDDING: local
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "workspace を build する（各パッケージの prepack が自分でも作り直すが、事前に揃えておく）"
        run: pnpm run build

      - name: "北極星7項目・tarball install の一覧を印字する（⛔ 門ではない。常に exit 0。Issue #387 / ADR 0216 決定7 段2）"
        run: node scripts/north-star-tarball-probe.mjs >> "$GITHUB_STEP_SUMMARY"
