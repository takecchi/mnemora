    # ⛔ **これは想起の質の門でも、統合の質の門でもない。**この bench が測るのは
    # 「載る量」（`store`/`recall.*.usage` の実測）と「そもそも縮んだか」であって、
    # `deterministic` LLM が作る統合結果の意味的な良し悪しではない
    # （AGENTS.md「`deterministic` で測った想起の質は、性能について何も言っていない」）。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `LocalEmbeddingProvider` はモデル重みの取得先を選ぶ鍵を要求しない
      # (`@mnemora/local-embedding` は外部サービスへ繋がない、ADR 0085)。
      # `consolidate()` は LLM も呼ぶが、`deterministic` に固定するため
      # `MNEMORA_PROVIDER_SOURCE`/`OPENAI_API_KEY` はこのジョブに関係が無い
      # （`RecordedLLMProvider` はカセットに統合プロンプトを持たないため使えない——
      # examples/chat/README.md「consolidation-cost」節参照）。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # 🔴 以前この6箇所は `local-embedding-ruri-v3-30m-q8-v1` という**手で版を振った
        # 固定文字列**で、revision も hash も入っていなかった ⟹ **HF の `main` が動いても、
        # 誰かが `-v1` を手で上げるまで CI は古い重みを配り続けた**（Issue #564）。
        #
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        # revision は `scripts/local-embedding-pinned-revision.json`
        # （Issue #597 案(a)の唯一の宣言）から読む——**この段はもう Hugging Face に
        # 問い合わせない**（ADR 0263 追記。以前は毎回 HF の `main` の sha を引いていた）。
        #
        # ⚠ **この宣言が古くなっていないかを見張るのは、この段ではない。**
        # `check-local-embedding-fingerprint.mjs`（下の「⭐ 門」ステップ）が
        # 引き続き `main` を照合する番犬として残る——上流の `main` が動いて門が
        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # `identifier-probes` ジョブと同じキー空間を使う——同じモデル
        # （`sirasagi62/ruri-v3-30m-ONNX`、既定 dtype）を使うため、キャッシュを分ける理由が無い。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: Runtime.consolidate() の「載る量」を実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        env:
          MNEMORA_CONSOLIDATION_JSON: ${{ github.workspace }}/consolidation-cost.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run consolidation-cost

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）——measure ステップが重み取得失敗で
