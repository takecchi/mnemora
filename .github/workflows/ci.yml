        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # `identifier-probes`/`consolidation-cost` ジョブと同じキー空間を使う——同じモデル
        # （`sirasagi62/ruri-v3-30m-ONNX`、既定 dtype）を使うため、キャッシュを分ける理由が無い。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: 掃引(Runtime.sweepArchive)が「載る量」に効くかを実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        env:
          MNEMORA_ARCHIVE_SWEEP_JSON: ${{ github.workspace }}/archive-sweep-cost.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run archive-sweep-cost

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）——measure ステップが重み取得失敗で
        # 落ちても、その理由を Job Summary へ出すのはこのステップの役目である。
        # `archive-sweep-cost-summary.mjs` 自体は「入力そのものが壊れている」ときだけ
        # 非0で終わる。
        if: always()
        run: |
          node scripts/archive-sweep-cost-summary.mjs \
            --measured "${{ github.workspace }}/archive-sweep-cost.json" \
            --baseline examples/chat/archive-sweep-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: archive-sweep-cost
          path: ${{ github.workspace }}/archive-sweep-cost.json
          if-no-files-found: ignore

  time-term:
    name: "時間項(freshness/decay)が順位を動かすかを実測し、値を残す（ADR 0058 / Issue #217）"
    runs-on: ubuntu-latest
    # Issue #217。`retrieval-quality`/`identifier-probes`/`consolidation-cost` と同じ体裁
    # ——「実測値を Job Summary へ残す・落とすのは bench 自体が壊れたときだけ」という形
    # （ADR 0088）。
    #
    # ⚠ **なぜ閾値の門にしないか**: 標本は probe 8件であり、ADR 0033 §3 の規律
    # （標本7件からは失敗率も成功率も統計的に主張しない）にそのまま照らせば、
    # 閾値判定に足る母数ではない（`identifier-probes`/`retrieval-quality` と同じ判断。
    # ADR 0058・Issue #217 本文も同じ理由を書いている）。
    #
    # ⚠ **`@mnemora/local-embedding` は使わない。**この bench は `deterministic`
    # embedding に固定される（ペアの本文が厳密に同一なので `similarity` は構成上
    # 定数になり、provider 層に依らない測定になる。ADR 0058 / `time-term-arm.ts`
    # docstring 参照）——⟹ HuggingFace への外向き通信も、モデル重みのキャッシュも
    # 「重みを取得できなかった」という失敗モードも、このジョブには無い
    # （`identifier-probes`/`consolidation-cost` との違い）。
    #
    # 🔴 **基準値ファイル `examples/chat/time-term-baseline.json`（ADR 0121）は、
    # ADR 0120 §5 が予告したとおり、初回 CI（main の run 34911117399、headSha
    # fd6ee53296f63c053fedf3706d2ba831b6d8e655）が出した artifact をそのまま基準値に
    # コミットしたものである。この作業環境に DB が無いため、基準値の作業者自身は
    # この bench を一度も自分の手で実行していない——値は CI が実測したものである
    # （基準値ファイルの `provenance` 参照）。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `time-term` は `deterministic` LLM + `deterministic` embedding に固定される
      # （`cli.ts` の `runTimeTerm()` docstring）——`MNEMORA_PROVIDER_SOURCE`/
      # `OPENAI_API_KEY` はこのジョブに関係が無い。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: freshness/decay が順位を動かすかを実測する（8 probe・擬似 provider）
        env:
          MNEMORA_TIME_TERM_JSON: ${{ github.workspace }}/time-term.json
        run: pnpm --filter @mnemora/example-chat run time-term

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）。`time-term-summary.mjs` 自体は
        # 「入力そのものが壊れている」ときだけ非0で終わる（JSON が読めない/parse
        # できない/形が想定と違う）。
        if: always()
        run: |
          node scripts/time-term-summary.mjs \
            --measured "${{ github.workspace }}/time-term.json" \
            --baseline examples/chat/time-term-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: time-term
          path: ${{ github.workspace }}/time-term.json
          if-no-files-found: ignore

  validity:
    name: "validAt ゲート(Issue #202 第2弾)が候補の有無を動かすかを実測し、値を残す（Issue #280）"
    runs-on: ubuntu-latest
    # `time-term` と同じ体裁——「実測値を Job Summary/artifact へ残す・落とすのは
    # bench 自体が壊れたときだけ」という**非ゲート**ジョブ（ADR 0088）。
    #
    # ⚠ **なぜ閾値の門にしないか**: 標本は probe 2件であり、ADR 0033 §3 の規律
    # （少標本からは失敗率も成功率も統計的に主張しない）にそのまま照らせば、
    # 閾値判定に足る母数ではない（`time-term`/`identifier-probes` と同じ判断）。
    #
    # ⚠ **`compare`（ADR 0133、required 門）とは別物である。** このジョブは
    # `examples/chat/compare-baseline.json` を一切参照せず、`examples/chat/src/scenario.ts`/
    # `compare.ts` にも配線していない——`validity` 専用の probe set・専用の tenant
    # スコープで、`compare` の回帰判定には一切影響しない。
    #
    # 🔴 **基準値ファイルは、まだ無い**（`time-term-baseline.json` のような形は、
    # この PR の作業環境に DB が無く一度も自分の手で実行できていないため、
    # 用意しなかった——ADR 0120 §5 が予告した「初回 CI の実測値をそのまま基準値に
    # コミットする」手順を、この PR ではまだ踏んでいない。差分の Job Summary 出力は
    # 次の担い手の作業とする。詳細は本 PR の ADR「射程外にしたもの」参照）。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `validity` は `deterministic` LLM + `deterministic` embedding に固定される
      # （`cli.ts` の `runValidity()` docstring）——`MNEMORA_PROVIDER_SOURCE`/
      # `OPENAI_API_KEY` はこのジョブに関係が無い。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: validAt ゲートが候補の有無をどう動かすかを実測する（2 probe・擬似 provider）
        env:
          MNEMORA_VALIDITY_JSON: ${{ github.workspace }}/validity.json
        run: pnpm --filter @mnemora/example-chat run validity

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validity
          path: ${{ github.workspace }}/validity.json
          if-no-files-found: ignore
