name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 元は PR タイトル/本文の ADR 番号検査（削除済み）のために入れたもの。
          # git の履歴を読むテスト（adr-index-freshness など）が shallow checkout で
          # 通るかは確かめていないため、残している。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: "公開 API 表面の破壊的変更を検出する門（Issue #342 / ADR 0178）"
        # 直前の Build ステップが作った packages/*/dist の .d.ts に依存する（自分では
        # ビルドし直さない）。既存の6つ目の門（pack:check）と同じジョブへ足す理由は
        # 直下の pack:check ステップのコメントと同じ——このジョブ名
        # （`typecheck / lint / test / build`）は branch protection の
        # required_status_checks に登録された文字列そのものであり、ジョブを分けると
        # オーナー権限での branch protection 更新が要る（ADR 0138 と同じ論拠）。
        run: pnpm run api:check

      - name: "配布物（packages/*/dist）が CommonJS として構文解析できること（Issue #110）"
        run: pnpm run check:cjs-parse

      - name: "publish 梱包の門（pack:check）を毎PRのCIでも走らせる（Issue #241）"
        # 六つの門（docs/autonomy.md §2）のうち pack:check だけが、これまで
        # publish.yml（release / workflow_dispatch 経由）でしか走っていなかった
        # ——毎 PR の CI（このジョブ）には一度も現れていなかった。
        #
        # このジョブに足す（独立ジョブにしない）理由: pack:check は各 publish
        # 対象パッケージの `prepack`（`tsc -p tsconfig.build.json`）を経由して
        # 自分で dist を作り直す（scripts/check-publish-pack.mjs 冒頭のコメント）ため、
        # 直前の Build ステップの成果物に依存しない。だから独立ジョブにしても
        # チェックアウト・install・build を丸ごとやり直すだけで意味が薄く、
        # このジョブの末尾に1ステップ足すほうが CI 時間の増分が小さい。
        # また、このジョブ名（`typecheck / lint / test / build`）は branch
        # protection の required_status_checks に登録された文字列そのものである
        # （`gh api repos/takecchi/mnemora/branches/main/protection` で確認済み）
        # ため、ジョブ名を変えたり分割したりすると別途 branch protection の更新が
        # 要る——それはこの PR の範囲外（オーナー権限の設定変更）とし、既存の
        # ジョブへステップを足す形に留めた。
        run: pnpm run pack:check

  postgres:
    name: packages/postgres (本物の Postgres + pgvector, server_encoding=${{ matrix.serverEncoding }})
    runs-on: ubuntu-latest
    # roadmap.md 段階2の完了条件: 「testkit の適合テストが postgres 実装に対してすべて通る
    # （2テナント分離のテストを含む）。EXPLAIN で実際に HNSW 索引が使われることを確認する
    # 検査が通る」。擬似物での置き換えを認めない——本物の Postgres の service container に
    # 対して実行する。
    #
    # 🔴 Issue #155(ADR 0105): このジョブだけを regime の matrix にする。オーナーが
    # 2026-09-12T00:09Z に「server_encoding=SQL_ASCII の PostgreSQL をサポート対象に
    # する」と決めた(ADR 0106 追記)——CI はその regime を一度も踏んでいなかった。
    # `fail-fast: false` を必ず付ける: SQL_ASCII 脚が落ちても UTF8 脚の証拠(artifact/
    # Job Summary)を残すため。⛔ 他5本の pgvector ジョブは matrix にしない
    # (Issue #155 の範囲外——まず1本で機序を確かめる)。
    strategy:
      fail-fast: false
      matrix:
        include:
          # UTF8 脚: Issue #148 由来の実測(main の run 34635954755)のままで、
          # 1バイトも変えない——過去の実測との比較可能性を壊さないため。
          - serverEncoding: UTF8
            initdbArgs: "--encoding=UTF8"
          # SQL_ASCII 脚: オーナーが決めた新しいサポート対象(ADR 0106 追記)。
          # `--locale=C` が要る——initdb は encoding とロケールの整合を検査するので、
          # SQL_ASCII だけを渡すと既定ロケール(実測 en_US.utf8)と噛み合わずに
          # コンテナの起動ごと落ちうる(それ自体が「POSTGRES_INITDB_ARGS が効いている」
          # という答えである。Issue #155 満たすべきこと5)。
          # ⛔ この `--locale=C` は「ロケールを ci.yml で宣言すること」(Issue #148 が
          # 順序として見送った側)ではない——ADR 0106 決定2が見送ったのは
          # `LANG`/`LC_*` の env や `--expect-locale` の門であり、`initdb` に
          # 要求される整合のための指定はその対象ではない。
          - serverEncoding: SQL_ASCII
            initdbArgs: "--encoding=SQL_ASCII --locale=C"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②/Issue #155: この CI が**どの regime で測っているか**を
          # 宣言する。matrix の脚ごとに値が変わる——UTF8 脚の値は変えていない
          # (上のコメント参照)。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである。測る前に宣言するのは、Issue #148 が「⛔ 順序を逆にしない」
          #    と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: ${{ matrix.initdbArgs }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Typecheck @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: Run postgres conformance / EXPLAIN / ADR 0011 tests against the real database
        # Issue #148: `MNEMORA_LEXICAL_REGIME_JSON` を渡す。`lexical-store-identifier.
        # test.ts` の「素の to_tsvector で識別子を引けるかどうかは server_encoding で
        # 反転する」の歯が、`expect` より前にこのパスへ測った regime を書く
        # (歯が赤くなっても値は残る)。このジョブの他のテストはこの変数を無視する。
        env:
          MNEMORA_LEXICAL_REGIME_JSON: ${{ github.workspace }}/lexical-regime.json
        run: pnpm --filter @mnemora/postgres run test:db

      - name: "実測した regime を Job Summary に残す(⛔ 値の良し悪しの門ではない。ただし宣言と実測の食い違いは門である。Issue #148 ②)"
        # このステップは常に走る(`if: always()`)——上の test:db が(regime とは無関係な
        # 理由も含め)落ちても、その run で regime を書けていたかどうかを Job Summary
        # から読めるようにする。`lexical-regime-summary.mjs` 自体は server_encoding /
        # nonAsciiIsIndexed の値そのものでは非0にならない——非0になるのは「値が出ていない
        # (歯が書いていない)」「JSON が壊れている」「値が空だった」、そして
        # 🔴 「この脚が宣言した POSTGRES_INITDB_ARGS(下の --expect-encoding)と、
        # 実際に測れた server_encoding が食い違った」の4つだけである(Issue #148 ②)。
        # **最後の1つだけは値を見るが、『UTF8 が正しい』ではなく『宣言どおりだったか』
        # だけを見る。**これは「値の良し悪しの門」ではなく「宣言と実測が揃っている
        # ことの門」である(`scripts/lexical-regime-summary-lib.mjs` の docstring)。
        # ⚠ --expect-encoding は matrix.serverEncoding にそのまま揃えている——
        # 揃っていることは scripts/__tests__/ci-yml-postgres-regime-wiring.test.mjs が
        # 固定している。
        if: always()
        run: |
          node scripts/lexical-regime-summary.mjs \
            --measured "${{ github.workspace }}/lexical-regime.json" \
            --expect-encoding "${{ matrix.serverEncoding }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "実測値そのもの(機械可読)を成果物として残す(Issue #148/#155)"
        # 🔴 artifact 名を脚ごとに分ける(lexical-regime-${{ matrix.serverEncoding }})。
        # 分けないと2脚が同じ名前へ upload しようとして衝突・上書きする
        # (Issue #155 満たすべきこと1)。
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lexical-regime-${{ matrix.serverEncoding }}
          path: ${{ github.workspace }}/lexical-regime.json
          if-no-files-found: ignore

      - name: Build @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run build

  postgres-regime-coverage:
    # ⚠ クォートが要る: YAML は `空白 + #` をコメントの開始として読むので、
    # 引用符なしだと check の名前が `…を測る(Issue` で**黙って切れる**
    # (2026-09-12 実測。required status check の名前と一致しなくなる)。
    name: "両方の server_encoding regime が実際に走ったことを測る (Issue #155)"
    needs: postgres
    # 🔴 `postgres` ジョブ(matrix)の一部の脚が落ちても、このジョブは必ず走る——
    # 「揃って別々に走ったか」を測れるだけの artifact は、失敗した run にも残りうる
    # (Issue #155 満たすべきこと2 の裏側)。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: postgres ジョブ(matrix)が skip されていないこと(⛔ skip を成功として読ませない)
        # ⚠ ここで見るのは "skipped" だけである。"failure"(片脚が落ちた)はこの
        # チェックを通す——落ちた脚の artifact が残っていれば、次の段で判定できる。
        run: |
          if [ "${{ needs.postgres.result }}" = "skipped" ]; then
            echo "postgres ジョブ(matrix)が skip された。両方の regime が実際に走ったかを" >&2
            echo "測れない——これは意図した失敗である(skip を成功として読ませないため、Issue #155)。" >&2
            exit 1
          fi

      - name: 両脚が残した lexical-regime-* artifact を全部ダウンロードする
        uses: actions/download-artifact@v6
        with:
          pattern: lexical-regime-*
          path: ${{ github.workspace }}/lexical-regime-artifacts

      - name: 両方の regime が実際に走ったかを判定する(⛔ 値の良し悪しではなく「揃って別々に走ったか」の門)
        # scripts/lexical-regime-coverage.mjs が非0で終わる経路は、期待する脚の
        # artifact が無い・JSON が壊れている・artifact 名と中身の server_encoding が
        # 食い違う・実際に測れた server_encoding が2種類に届かない、の4つ
        # (Issue #155 満たすべきこと2)。期待する脚の集合(UTF8/SQL_ASCII)は
        # scripts/lexical-regime-coverage-lib.mjs の EXPECTED_SERVER_ENCODINGS に
        # 持たせてあり、それが上の matrix の脚と一致していることは
        # scripts/__tests__/ci-yml-postgres-regime-coverage-wiring.test.mjs が固定している。
        run: |
          node scripts/lexical-regime-coverage.mjs \
            --artifacts-dir "${{ github.workspace }}/lexical-regime-artifacts" \
            >> "$GITHUB_STEP_SUMMARY"

  example-chat:
    # 🔴🔴 ⛔ 直上の `name:` は変えない —— この文字列は branch protection の
    # required status check の*文脈名*そのものである【実測、2026-09-23】:
    #   gh api repos/takecchi/mnemora/branches/main/protection/required_status_checks
    # の `contexts`（6件）に、この文字列が逐語で入っている。ここを書き換えると
    # required check が「見つからない」状態になり、branch protection 側の設定変更
    # （オーナー領分）が要る。
    #
    # 🔴 そして「擬似 provider」は、このジョブ全体の名乗りとしては不正確——ステップ
    # ごとに層が混在している(下記、各ステップの env・コメントで実測。推測ではない):
    #   - `test:db` / `correction` ステップ: `deterministic`(意味を持たない stub。
    #     OPENAI_API_KEY 未設定、MNEMORA_LLM/MNEMORA_EMBEDDING の override も無し)
    #   - `compare` ステップ: **`recorded`**(記録した実 API 応答の再生)。
    #     `examples/chat/cassettes/compare.json` が在るため `decideProviderSource`
    #     が「no-key」理由で `recorded` を選ぶ——「擬似物」ではない
    #     (`AGENTS.md`「⚠『実 API を叩かない』は『擬似物で走る』と同じではない」、
    #     下の compare ステップのコメント参照)。
    # ⟹ 直せるのは名前ではなく名指しの精度のほうである、という判断と経緯は ADR 0274。
    name: examples/chat (本物の Postgres + pgvector、擬似 provider)
    runs-on: ubuntu-latest
    # roadmap.md 段階7の完了条件: 「サンプルアプリが observe → recall の往復を実演し、
    # omitted と usage を画面またはログに可視化する」。PR 本文「サンプルアプリ自体が
    # 壊れていないことを CI で検査する」——LLM/Embedding は既定で @mnemora/testkit の
    # provider に置き換わる(OPENAI_API_KEY を設定しない)が、**ステップごとに層が違う**
    # (`test:db`/`correction` は `deterministic`、`compare` は `recorded`——直上の
    # `name:` の注記参照)。DB は擬似物で代替しない。本物の Postgres の
    # service container に対して実行する。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # 🔴 Issue #164 (1): `test:db`(= `vitest run`)は `root-gate-db-stage`
      # ジョブが `run-db-tests.mjs` 経由で走らせるのと**同じ**
      # `consolidation-cost.postgres.test.ts` を実行する——`warmupLocalEmbedding` が
      # `@mnemora/local-embedding` のモデル一式(4ファイル計42MB、うち重み36MB)を
      # Hugging Face から取得する。
      # 2026-09-12 の run 34699094705(14:25 UTC)では、このジョブ自身は
      # `✓ src/__tests__/consolidation-cost.postgres.test.ts (3 tests) 43228ms`
      # で成功していたが、同 run の `root-gate-db-stage` は重み取得が 429 になって
      # 落ちた——**同じ重みを取りに行くジョブが実は4本ある**うちの1本である。
      # 🔑 `identifier-probes`/`consolidation-cost`/`root-gate-db-stage` と
      # **同じキー空間を意図的に共有する**(下の cache 段の `key` を参照。同じモデル
      # `sirasagi62/ruri-v3-30m-ONNX` を使うため分ける理由が無い)。
      # ⚠ この job-level env は後段の `compare` ステップにも見えるが、`compare` では
      # 読まれない
      # (`examples/chat/src/providers.ts` は `embeddingMode === "local"` のときだけ
      # `LocalEmbeddingProvider` へ `cacheDir` を渡す。このジョブの `compare` は
      # `embeddingMode` が `"local"` ではないため——ただし `"deterministic"` でもなく
      # **`"recorded"`** である。以前ここは「OPENAI_API_KEY 無しの擬似 provider」と
      # 書いていたが、それは誤りだった。下の `compare` ステップのコメント参照)。
      MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Typecheck examples/chat
        run: pnpm --filter @mnemora/example-chat run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # 🔴 以前この6箇所は `local-embedding-ruri-v3-30m-q8-v1` という**手で版を振った
        # 固定文字列**で、revision も hash も入っていなかった ⟹ **HF の `main` が動いても、
        # 誰かが `-v1` を手で上げるまで CI は古い重みを配り続けた**（Issue #564）。
        #
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        # revision は `scripts/local-embedding-pinned-revision.json`
        # （Issue #597 案(a)の唯一の宣言）から読む——**この段はもう Hugging Face に
        # 問い合わせない**（ADR 0263 追記。以前は毎回 HF の `main` の sha を引いていた）。
        #
        # ⚠ **この宣言が古くなっていないかを見張るのは、この段ではない。**
        # `check-local-embedding-fingerprint.mjs`（下の「⭐ 門」ステップ）が
        # 引き続き `main` を照合する番犬として残る——上流の `main` が動いて門が
        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 🔴 ⛔ これは「取りに行く頻度」を下げる変更であって、「取れなかったときの
        # 倒れ方」は変えていない。リトライ・フォールバック・既定値・skip は
        # 入れていない——重みがキャッシュにも Hugging Face にも無ければ、
        # 次の test:db ステップは従来どおり赤くなる。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: Run examples/chat の observe→recall 往復・量の比較テストを本物の DB に対して実行
        run: pnpm --filter @mnemora/example-chat run test:db

      - name: local-embedding が実際に読み込んだ重みファイルは、宣言された Hugging Face repo が今まさに持っているものと一致しているか(⭐ 門)
        # 🔴 なぜここか: 直前の test:db ステップが(cache がヒットしていればキャッシュから、
        # ミスしていれば Hugging Face から)local-embedding のモデル一式を既に読み込み
        # 終えている。⟹ ここで改めてファイルを取りに行く必要は無く、追加のネットワーク
        # 費用は Hugging Face の tree API を1回(+再試行)引くだけでほぼ無い。
        # `scripts/check-local-embedding-fingerprint.mjs` の docstring の判定表のとおり、
        # exit 0=一致 / 1=不一致(赤) / 2=保留(HF API に届かない) / 3=実行時エラー。
        #
        # ⛔ `continue-on-error: true` は使わない——それだと exit 1(不一致)まで
        # 素通りしてしまい、この段が門でなくなる。
        # 🔴 exit 2(保留)だけはジョブを落とさない——落とすと exit 1(赤)と区別が
        # 付かなくなる(スクリプト側の判定表が空文になる)。だから shell 側で終了コードを
        # 見て分岐する(`publish.yml` の `set +e` → `STATUS=$?` → `set -e` と同じ形。
        # ci.yml の shell は既定の `bash -e` である——ADR 0245)。
        # ⭐ 一致・保留のどちらでも Job Summary に1行残す——「何も出ていない」を
        # 「ステップが走らなかった」と区別できるようにするため。
        env:
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: |
          set +e
          node scripts/check-local-embedding-fingerprint.mjs \
            --cache-dir "${MNEMORA_LOCAL_EMBEDDING_CACHE_DIR}"
          CODE=$?
          set -e
          case "${CODE}" in
            0)
              echo "🟢 local-embedding fingerprint: 宣言された repo の内容と一致した" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::warning::local-embedding fingerprint の判定を保留した(Hugging Face API に届かなかった)——一致も不一致も確認していない。"
              echo "🟡 local-embedding fingerprint: 判定していない(Hugging Face API に届かなかった。上の warning 参照)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "${CODE}"
              ;;
          esac

      - name: "固定入力に対する embedding 出力を測り、sha256・次元数・lscpu を残す(測るだけ、門にはしない。Issue #565 / ADR 0253 追記)"
        # 🔴 [Issue #565](https://github.com/takecchi/mnemora/issues/565) が
        # 「採るとしたら何が要るか」として挙げた4項目のうち、(1)固定入力に対する
        # embed() の sha256、(3)lscpu、を満たす(比較段(4)は別ジョブ、
        # 既存の3段の形への合流(2)は下2ステップ)。
        #
        # ⛔ **これは門ではない。** 一致・不一致のどちらでも、この段は exit 0 のまま
        # である(`scripts/measure-embedding-output-fingerprint.mjs` 参照)。
        #
        # 🔑 **モデルの読み込みを既存の段と共有する**: 直前の test:db ステップが
        # 既に @mnemora/local-embedding のモデル一式をディスクキャッシュ
        # (`MNEMORA_LOCAL_EMBEDDING_CACHE_DIR`)へ読み込み終えている。ここで
        # `warmup()` を呼び直しても、ネットワークへは行かずディスクキャッシュから
        # 読むだけである——追加費用は推論1回(数秒)のみ。
        #
        # ⚠ **2つのコマンドを順に走らせるが、片方が失敗しても後段を必ず試す**
        # (`local-embedding が実際に読み込んだ重み...` ステップと同じ
        # `set +e`/`STATUS=$?`/`set -e` の形、ADR 0245)。重みを取得できなかった
        # (embedding-fingerprint が exit 1)場合でも、その事実を測定 JSON へ
        # 残すところまでは行う——ただし段全体の exit code は最初のコマンドの
        # 失敗を引き継ぐ(このジョブが赤くなること自体は仕様。identifier-probes
        # ジョブ等と同じ規律)。
        env:
          MNEMORA_EMBEDDING_FINGERPRINT_RAW_JSON: ${{ github.workspace }}/embedding-fingerprint-raw.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: |
          set +e
          pnpm --filter @mnemora/example-chat run embedding-fingerprint
          EMBED_STATUS=$?
          node scripts/measure-embedding-output-fingerprint.mjs \
            --raw "${{ github.workspace }}/embedding-fingerprint-raw.json" \
            --out "${{ github.workspace }}/embedding-fingerprint.json" \
            --runner-name "${{ runner.name }}"
          MEASURE_STATUS=$?
          set -e
          if [ "${EMBED_STATUS}" -ne 0 ]; then
            exit "${EMBED_STATUS}"
          fi
          exit "${MEASURE_STATUS}"

      - name: "実測値を Job Summary に残す(⛔ 門ではない。Issue #565)"
        if: always()
        run: |
          node scripts/embedding-output-fingerprint-summary.mjs \
            --measured "${{ github.workspace }}/embedding-fingerprint.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "固定入力の embedding 出力の指紋を成果物として残す(Issue #565)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: embedding-output-fingerprint-example-chat
          path: ${{ github.workspace }}/embedding-fingerprint.json
          if-no-files-found: ignore

      - name: "correction サブコマンド(cli.ts の dispatch 行)を実際に実行し、recall 段3(矛盾の解決と必須の同伴取得)が本番経路で発火することを CI が判定する(Issue #374 / ADR 0190)"
        # 🔴 Issue #374: `grep -c "correction" .github/workflows/ci.yml` が 0 だった
        # ——`examples/chat/src/cli.ts` の `command === "correction"` という
        # dispatch 行は、これまで CI から一度も実行されていなかった
        # (`correction-demo.postgres.test.ts` は `runCorrectionDemo()` を直接
        # import しており、この dispatch 行を経由しない)。⟹ その行が消えても
        # CI は緑のままだった。既存のこのジョブに1ステップ足すだけで済ませる
        # (`DATABASE_URL`・拡張・migrate は上のステップ群がすでに整えている——
        # 新しいコンテナも install も migrate も増えない)。
        #
        # provider は `deterministic`(明示 override 無し、OPENAI_API_KEY 無し)。
        # `recorded` にしない理由: `examples/chat/cassettes/` に correction 用の
        # 記録が無く、`recorded` は記録に無い入力を例外にする(ADR 0051)。
        # このデモが確かめる性質(mandatory companion retrieval・
        # resolveContested のフィルタ)はスコアの質に依存しない構造的な検査なので
        # `deterministic` で足りる(`examples/chat/src/cli.ts` の `runCorrection()`
        # doc コメント参照)。
        #
        # `pnpm --filter @mnemora/example-chat run correction` は、印字するだけで
        # 終わらない——`checkCorrectionDemo()` の7欄 + `checkCorrectionOmission()`
        # (omitted に condition="superseded" が実際に記録されているか、北極星
        # 項目6「消えた」と「最初から無かった」の区別)の1欄、計8欄を assert し、
        # 1つでも false なら非0で終わる。
        run: pnpm --filter @mnemora/example-chat run correction

      - name: 北極星の物差し（会話ログを全部積むのをやめてもどれだけ削れたか・冒頭の事実の出典に到達できるか）を compare で実測しログに残す
        # 🔴 このステップは `OPENAI_API_KEY` を設定していないが、**擬似(deterministic)
        # provider では走らない**——`examples/chat/cassettes/compare.json`
        # （ADR 0052 の `record:compare`）が存在するため、`resolveCassetteForRun`
        # （`cli.ts`）経由の `decideProviderSource` が「no-key」理由で `recorded`
        # （記録した実 API 応答の再生）を選ぶ。このコメントは以前「擬似 provider で
        # 走る」と書いていたが、それは誤りだった——実測（ADR 0133）で判明し、この
        # コメントは実際の挙動に合わせて訂正した。`compare` は
        # 「量を削れたか」（naive/mnemora の文字数比）だけでなく、本 PR で追加した
        # 「冒頭の事実の出典に削った後にも到達できるか」「スコープ内の何件が実際に ANN の
        # 候補になれたか（= 何件と競って絞ったか）」を表にして出力する
        # （docs/north-star.md の物差し、examples/chat/README.md
        # 「⭐ 削減率だけでは意味を持たない——答えが残っているか」節）。
        # これまでこの数値は手元で測ったきり CI では実測していなかった
        # （ADR 0021 参照）——このステップはそれを埋め、以後の変更で
        # 「削れたが出典に到達できなくなった」への回帰をログから読めるようにする
        # （情報保持・最終回答の正誤はこのステップでは測っていない。ADR 0226）。
        #
        # 🔴 Issue #242 / ADR 0133: `MNEMORA_COMPARE_JSON` で機械可読な出力口を足した
        # （`retrieval`/`time-term` と同じ規約、`examples/chat/src/compare-json.ts`）。
        # 基準値ファイル `examples/chat/compare-baseline.json` は、この機構を配線した
        # 最初の CI run（同一 commit を2回実行し、`measuredAt` を除いて完全一致した
        # ことを確認した run）の artifact をそのままコミットしたものである
        # （詳細は基準値ファイルの `provenance` / ADR 0133「測ったこと」参照）。
        env:
          MNEMORA_COMPARE_JSON: ${{ github.workspace }}/compare.json
        run: pnpm --filter @mnemora/example-chat run compare

      - name: 北極星の物差しが基準値から悪化していないかを判定する（⭐ 門。ADR 0133）
        # 🔴 このステップは他5本の summary 段と違い、**門である**。
        # `scripts/compare-summary.mjs` は、同一 commit の CI 2回実行が
        # `measuredAt` を除いて完全一致した（ADR 0133「測ったこと」）ことを踏まえ、
        # `mnemoraShareOfNaiveChars` の悪化・`factStatementSurvived` の
        # true→false 退行を検知すると非0で終わる（`compare-summary-lib.mjs` の
        # `evaluateCompare`）。それ以外の入力異常（JSON が読めない/parse
        # できない/形が想定と違う）でも非0になる。
        # 🔴 さらに Issue #477 から、**実測と基準値の turnCount 集合が一致しない**
        # （比較していない会話長が在る）ときは exit 2（判定不能）で非0になる
        # ——「比較していない」を「退行が無い」と同じ顔で緑にしないためである。
        # このステップは常に走る
        # （`if: always()`）——`compare` 自体が壊れて JSON を書けなかった場合も、
        # その理由を Job Summary に残す。
        if: always()
        run: |
          node scripts/compare-summary.mjs \
            --measured "${{ github.workspace }}/compare.json" \
            --baseline examples/chat/compare-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: compare の実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compare
          path: ${{ github.workspace }}/compare.json
          if-no-files-found: ignore

      - name: "RecallQuery.timeWeighting（legacy/eventAwareFreshness、Issue #690・ADR 0300）を answer-time-weighting で再生し、正誤の表をログへ残す"
        # 🔴 このステップも `OPENAI_API_KEY` を設定していないが、`compare` と同じ理由で
        # 擬似(deterministic) provider では走らない——`examples/chat/cassettes/
        # answer-time-weighting.json`（段3b-2、`record:answer-time-weighting` を
        # temperature=0 で実行して作った）が存在するため、`resolveRecordedRun`
        # 経由の `decideProviderSource` が「no-key」理由で `recorded`（記録した実 API
        # 応答の再生）を選ぶ。鍵は要らないが、擬似物でもない
        # （AGENTS.md「⚠『実 API を叩かない』は『擬似物で走る』と同じではない」）。
        #
        # ⛔ **このステップ自体は門ではない。** 実際の合否判定（記録した時点の
        # gradeAnswer 正誤を1バイトも変えず再生できるか）は、このジョブの前段
        # `test:db`（`examples/chat/src/__tests__/time-weighting-recorded-replay
        # .postgres.test.ts`）が既に検査している——ここは legacy/eventAwareFreshness
        # の正誤の表を人間が読める形で Job Summary 相当のログに残すだけの、
        # `compare` ステップと同格の可視化である。
        #
        # 🔴 既知の取り引き（ADR 0300）: `reinforced-fact-vs-fresh-weak` 類型は
        # legacy が構造的に失敗し eventAwareFreshness が直す——この表にもその非対称が
        # そのまま出る。隠さない。
        env:
          MNEMORA_TIME_WEIGHTING_JSON: ${{ github.workspace }}/answer-time-weighting.json
        run: pnpm --filter @mnemora/example-chat run answer-time-weighting

      - name: answer-time-weighting の実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: answer-time-weighting
          path: ${{ github.workspace }}/answer-time-weighting.json
          if-no-files-found: ignore

  root-gate-db-stage:
    name: ルートの test 門の DB 段（DATABASE_URL 在りで順方向に実測、ADR 0015）
    runs-on: ubuntu-latest
    # ADR 0015「ルートの test 門は、DB テストを『走らせなかった』と明示する」の
    # 「確かめていないこと」1・2つ目を塞ぐジョブ。
    #
    # ルートの `pnpm run test` は最後に `node scripts/run-db-tests.mjs` を呼ぶ
    # （DATABASE_URL が無ければ「実行していません」と告知して緑、在れば
    # `pnpm -r --if-present run test:db` を走らせて、落ちれば赤・通れば
    # 「✔ DB テストも実行し、通りました。」で緑になる段）。
    # `postgres` / `example-chat` ジョブは `test:db` を各パッケージに直接呼んでおり、
    # この段そのものを一度も経由しない。つまり「DATABASE_URL 在りでこの段が
    # 実際に走って緑になる」ことは、CI ではまだ誰も実測していなかった。
    # このジョブはその1点だけを測る——DB テストそのものの合否は上の2ジョブの役目のまま
    # （置き換えない）。
    #
    # 「ルートの test がこの段を呼ぶ配線」自体は、
    # scripts/__tests__/run-db-tests.test.mjs の「ルートの test 門の配線」が
    # package.json の scripts.test を静的に検査して常時押さえている。
    # ここではその配線ではなく、段そのものの実行結果（DATABASE_URL 在り・
    # 対象パッケージが全部通ったときに実際に緑になること）を実測する。
    # 歯（配線・未設定側・落ちた側）とこのジョブ（順方向の実物）とで役割を分けている。
    #
    # `pnpm run test` 全体ではなく DB 段だけを直接呼ぶ: 型検査・lint・format・
    # 各パッケージの単体テスト・build は `build` ジョブがすでに測っており、
    # ここで二重に走らせて時間を伸ばさない。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # 🔴 Issue #164 (1): このジョブは `node scripts/run-db-tests.mjs` 経由で
      # `examples/chat` の `test:db`(= `vitest run`)を呼ぶ。その中の
      # `consolidation-cost.postgres.test.ts` が `warmupLocalEmbedding` を通じて
      # `@mnemora/local-embedding` のモデル一式(4ファイル計42MB、うち重み36MB)を
      # 実際に Hugging Face から取得する——`identifier-probes`/`consolidation-cost` ジョブと同じ理由で、
      # このジョブも「毎 run 素で重みを取りに行く」側だった。2026-09-12 の
      # run 34699094705(14:25 UTC)では、この重み取得が 429 になって1本の PR を
      # 止めた実測がある。
      # 🔑 `identifier-probes`/`consolidation-cost` と**同じキー空間を意図的に
      # 共有する**(下の cache 段の `key` を参照。同じモデル
      # `sirasagi62/ruri-v3-30m-ONNX` を使うため分ける理由が無い)。
      MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # 🔴 以前この6箇所は `local-embedding-ruri-v3-30m-q8-v1` という**手で版を振った
        # 固定文字列**で、revision も hash も入っていなかった ⟹ **HF の `main` が動いても、
        # 誰かが `-v1` を手で上げるまで CI は古い重みを配り続けた**（Issue #564）。
        #
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        # revision は `scripts/local-embedding-pinned-revision.json`
        # （Issue #597 案(a)の唯一の宣言）から読む——**この段はもう Hugging Face に
        # 問い合わせない**（ADR 0263 追記。以前は毎回 HF の `main` の sha を引いていた）。
        #
        # ⚠ **この宣言が古くなっていないかを見張るのは、この段ではない。**
        # `check-local-embedding-fingerprint.mjs`（下の「⭐ 門」ステップ）が
        # 引き続き `main` を照合する番犬として残る——上流の `main` が動いて門が
        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 🔴 ⛔ これは「取りに行く頻度」を下げる変更であって、「取れなかったときの
        # 倒れ方」は変えていない。リトライ・フォールバック・既定値・skip は
        # 入れていない——重みがキャッシュにも Hugging Face にも無ければ、
        # このジョブは従来どおり赤くなる。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: ルートの門の DB 段を DATABASE_URL 在りで通す（順方向の実測）
        run: |
          set -euo pipefail
          node scripts/run-db-tests.mjs 2>&1 | tee gate.log
          grep -F "DB テストを実行します" gate.log
          # 接続先の Postgres が実際に読めていること。純関数の形は
          # scripts/__tests__/db-server-description.test.mjs が測るが、
          # 「本物の DB に繋いで版が取れる」ことを測れるのは、DB を持つこのジョブだけ。
          grep -E "接続先: PostgreSQL [0-9]+" gate.log
          # CI の service container は pgvector/pgvector:pg17 なので、検証済みの版であり
          # 未検証の警告は出てはいけない。出るなら CI の版か検証済み一覧のどちらかがずれている。
          if grep -F "検証されていない版です" gate.log; then
            echo "CI の Postgres が検証済み一覧から外れている（VERIFIED_MAJOR_VERSIONS を見直すこと）" >&2
            exit 1
          fi
          grep -F "✔ DB テストも実行し、通りました。" gate.log
          if grep -F "DB テストは実行していません" gate.log; then
            echo "DB 段が未実行の側へ落ちた" >&2
            exit 1
          fi

      - name: "固定入力に対する embedding 出力を測り、sha256・次元数・lscpu を残す(測るだけ、門にはしない。Issue #565 / ADR 0253 追記)"
        # `example-chat` ジョブの同名ステップと対になる(ci-green-check.mjs が挙げた
        # 「本物の重みで本物の推論を通す2ジョブ」のもう一方)。理由・費用・門にしない
        # 判断は、あちらのコメントを参照——ここでは重複させない。
        #
        # 🔑 **モデルの読み込みを既存の段と共有する**: 直前の「ルートの門の DB 段」
        # ステップが `run-db-tests.mjs` 経由で `examples/chat` の `test:db` を実行し、
        # 既に @mnemora/local-embedding のモデル一式をディスクキャッシュ
        # (`MNEMORA_LOCAL_EMBEDDING_CACHE_DIR`、このジョブの job-level env)へ
        # 読み込み終えている。
        env:
          MNEMORA_EMBEDDING_FINGERPRINT_RAW_JSON: ${{ github.workspace }}/embedding-fingerprint-raw.json
        run: |
          set +e
          pnpm --filter @mnemora/example-chat run embedding-fingerprint
          EMBED_STATUS=$?
          node scripts/measure-embedding-output-fingerprint.mjs \
            --raw "${{ github.workspace }}/embedding-fingerprint-raw.json" \
            --out "${{ github.workspace }}/embedding-fingerprint.json" \
            --runner-name "${{ runner.name }}"
          MEASURE_STATUS=$?
          set -e
          if [ "${EMBED_STATUS}" -ne 0 ]; then
            exit "${EMBED_STATUS}"
          fi
          exit "${MEASURE_STATUS}"

      - name: "実測値を Job Summary に残す(⛔ 門ではない。Issue #565)"
        if: always()
        run: |
          node scripts/embedding-output-fingerprint-summary.mjs \
            --measured "${{ github.workspace }}/embedding-fingerprint.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "固定入力の embedding 出力の指紋を成果物として残す(Issue #565)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: embedding-output-fingerprint-root-gate-db-stage
          path: ${{ github.workspace }}/embedding-fingerprint.json
          if-no-files-found: ignore

  embedding-output-fingerprint-compare:
    name: "固定入力に対する embedding 出力の指紋を2ジョブ間で突き合わせる(測るだけ。門にはしない。Issue #565 / ADR 0253 追記)"
    needs: [example-chat, root-gate-db-stage]
    # 🔴 `postgres-regime-coverage` ジョブと同じ理由——`example-chat` /
    # `root-gate-db-stage` のどちらかが(重み取得失敗などで)落ちても、
    # このジョブは必ず走る。落ちた側の artifact が無ければ
    # `compare-embedding-output-fingerprints.mjs` が「比較できなかった」と
    # 名乗るだけであり(一致とも不一致とも言わない)、それ自体はこのジョブを
    # 落とさない(⛔ 門ではない)。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "両ジョブが残した embedding-output-fingerprint-* artifact を集める(無ければ無いまま——このジョブは落とさない。Issue #565)"
        uses: actions/download-artifact@v6
        with:
          pattern: embedding-output-fingerprint-*
          path: ${{ github.workspace }}/embedding-fingerprint-artifacts

      - name: "2ジョブの指紋を突き合わせ、一致・不一致・比較できなかったを Job Summary に残す(⛔ 門ではない。常に exit 0。Issue #565)"
        run: |
          node scripts/compare-embedding-output-fingerprints.mjs \
            --artifacts-dir "${{ github.workspace }}/embedding-fingerprint-artifacts" \
            >> "$GITHUB_STEP_SUMMARY"

  retrieval-quality:
    name: 想起の質を実 embedding（記録の再生）で実測し、値を残す（ADR 0088）
    runs-on: ubuntu-latest
    # ADR 0088。**ADR 0022 の「これが覆るとしたら」第1項が名指しした負債を返すジョブ。**
    #
    # ADR 0022 は「`retrieval` は本物の API キーが要るため CI には載っていない
    # （手動実行のみ）」を前提に、「想起の質の回帰を検知する歯が無い」を負債として
    # 引き受けていた。**その前提はもう成り立たない。**ADR 0051 のカセット
    # （examples/chat/cassettes/retrieval.json — 実 API の埋め込み 152 件、
    # text-embedding-3-small / 256 次元）を再生すれば、鍵なしに実 embedding の
    # 想起の質を測れる。追加コストは 0 であり、ADR 0022 が言う「安価な embedding
    # provider」に文言どおり一致する。
    #
    # ⛔ **このジョブは門ではない。**基準値と違っても落ちない。
    # 落ちるのは bench そのものが壊れたときだけ（カセットに無い入力・DB エラー・
    # 出力が壊れている）。理由は ADR 0088 §2:
    #   - decay/freshness は時刻に依存し、実行ごとに実際に揺れる（total の6桁目が動く）。
    #     見出しの数字が安定するのは similarity の変域が decay の約 10^6 倍だからで、
    #     「2 回一致した」は決定性の証明ではない。偽陽性率に上限を置けない。
    #   - 標本は probe 7 件しかない（ADR 0033 §3）。閾値の門は偽陽性を出す。
    #
    # ⚠ **`compare` ステップ（example-chat ジョブ）と同じ轍を踏まないこと。**
    # あちらは「回帰をログから読めるようにする」と約束したきり、表の中身に対する
    # assertion を1つも持たない——気づくかどうかが生ログを開くかどうかに委ねられている。
    # このジョブは値を生ログではなく **Job Summary**（PR の Checks から
    # ダウンロードなしで読める場所）へ出し、**基準値と一致していれば1行で黙り、
    # 違うときだけ展開する**。git に残るのは基準値ファイルの diff のほうである。
    timeout-minutes: 20
    # ⚠ この repo は timeout-minutes を1箇所も設定しておらず、既定は 360 分である。
    # bench 自体は数秒で終わる（手元の実測で 4.9 秒）。刺さったときに6時間燃やさない
    # ためだけの上限であり、**この1ジョブにだけ付けている**（既存ジョブへ一斉に
    # 付けるのは ADR 0088 の範囲外）。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # ⭐ **明示する。**CI には OPENAI_API_KEY が無いので既定でも recorded に落ちるが、
      # 既定に頼ると「いつか鍵が入った日」に、このジョブが黙って実 API を叩き始める
      # （decideProviderSource の既定は「キーが在れば実 API」）。ADR 0068 が
      # この明示指定を足したのは、まさにその口を塞ぐためである。
      MNEMORA_PROVIDER_SOURCE: recorded
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: 想起の質を実 embedding（記録の再生）で実測する
        # `retrieval` は DATABASE_URL を要求し、擬似物へ黙ってフォールバックしない
        # （requireDatabaseUrl）。arm を選ぶ口は無いので A/B/C の3本すべてが走る——
        # ⚠ arm A（擬似LLM+擬似埋め込み）の MRR 0.018 は実質ランダムであり、
        # これを「引けた」と読んではいけない（ADR 0022 / AGENTS.md）。
        env:
          MNEMORA_RETRIEVAL_JSON: ${{ github.workspace }}/retrieval-quality.json
        run: pnpm --filter @mnemora/example-chat run retrieval

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは基準値との相違では落ちない（exit 0）。入力そのものが
        # 壊れているときだけ非0で落ちる。ADR 0088 §2.1。
        run: |
          node scripts/retrieval-quality-summary.mjs \
            --measured "${{ github.workspace }}/retrieval-quality.json" \
            --baseline examples/chat/retrieval-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-quality
          path: retrieval-quality.json
          if-no-files-found: ignore

  identifier-probes:
    name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測し、値を残す
    runs-on: ubuntu-latest
    # Issue #109（#106 由来）。`retrieval-quality` ジョブと同じく「実測値を Job Summary
    # へ残す・落とすのは bench 自体が壊れたときだけ」という形を踏襲するが、
    # **このジョブが想定する主な失敗は基準値との相違ではなく「HF からモデル重みを
    # 取得できないこと」である**。
    #
    # ⚠ **なぜ閾値の門にしないか**: ADR 0088 が `retrieval-quality` について
    # 「標本7件では偽陽性を出す」として明示的に採らなかったのと同じ理由——この bench の
    # probe は30件(識別子)・12件(日本語)であり(ADR 0094 追記 / PR #191 / PR #192)、
    # ADR 0033 §3 の規律に照らして統計的な閾値判定に足る母数ではない。probe を増やした後、
    # 別途測ってから決める段取りである。
    #
    # 🔴 **ただし「重みを取得できなかった」ときは、このジョブ自体を意図して失敗させる**
    # ——`identifier-probes` サブコマンドは `warmup()` が失敗したらメトリクスを1件も
    # 出さずに `process.exitCode = 1` で終わる仕様であり(`local-embedding-warmup.ts`)、
    # それをこのジョブでも尊重する(揉み消さない)。measure ステップが失敗しても、
    # 後続の summary/artifact ステップは `if: always()` で必ず走り、「重みが取得
    # できなかった」ことを Job Summary に明示する(`buildSummaryMarkdown` の
    # `weights_unavailable` 分岐)。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          # 🔴 Issue #148 ②: この CI が**どの regime で測っているか**を宣言する。
          # 値は推測ではない——PR #149 が入れた可視化が main の run 34635954755 で
          # 実測した server_encoding そのもの(artifact `lexical-regime`)である。
          # ⛔ ロケール(LANG / LC_COLLATE / LC_CTYPE)は宣言しない。**まだ測っていない**
          #    からである(この PR で測る側には足したが、その実測値が出るのは
          #    この PR の CI が初めてである)。測る前に宣言するのは、Issue #148 が
          #    「⛔ 順序を逆にしない」と名指しで禁じた形そのものである。
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `LocalEmbeddingProvider` はモデル重みの取得先を選ぶ鍵を要求しない
      # (`@mnemora/local-embedding` は外部サービスへ繋がない、ADR 0085)——
      # `MNEMORA_PROVIDER_SOURCE`/`OPENAI_API_KEY` はこのジョブに関係が無い。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # 🔴 以前この6箇所は `local-embedding-ruri-v3-30m-q8-v1` という**手で版を振った
        # 固定文字列**で、revision も hash も入っていなかった ⟹ **HF の `main` が動いても、
        # 誰かが `-v1` を手で上げるまで CI は古い重みを配り続けた**（Issue #564）。
        #
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        # revision は `scripts/local-embedding-pinned-revision.json`
        # （Issue #597 案(a)の唯一の宣言）から読む——**この段はもう Hugging Face に
        # 問い合わせない**（ADR 0263 追記。以前は毎回 HF の `main` の sha を引いていた）。
        #
        # ⚠ **この宣言が古くなっていないかを見張るのは、この段ではない。**
        # `check-local-embedding-fingerprint.mjs`（下の「⭐ 門」ステップ）が
        # 引き続き `main` を照合する番犬として残る——上流の `main` が動いて門が
        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 実測（この作業を行った器）では transformers.js の既定キャッシュは
        # `node_modules/.pnpm/@huggingface+transformers@4.2.0/.../.cache/` に落ちた。
        # ⚠ CI ランナーでは同じ場所とは限らない（pnpm のバージョン・store の位置に依存する）
        # ため、`MNEMORA_LOCAL_EMBEDDING_CACHE_DIR`（`examples/chat/src/providers.ts` が
        # `LocalEmbeddingProvider` の `cacheDir` オプションへそのまま渡す——**使うだけで
        # `@mnemora/local-embedding` 自体は変更していない**）で場所を明示的に固定する。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        # 後続の summary/artifact ステップだけを `if: always()` で必ず走らせる。
        env:
          MNEMORA_IDENTIFIER_PROBE_JSON: ${{ github.workspace }}/identifier-probe.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run identifier-probes

      - name: 実測値と基準値の差分、または「重みが取得できなかった」ことを Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る（`if: always()`）——measure ステップが重み取得失敗で
        # 落ちても、その理由を Job Summary へ出すのはこのステップの役目である。
        # `identifier-probe-summary.mjs` 自体は「入力そのものが壊れている」ときだけ
        # 非0で終わる(JSON が読めない/parse できない/形が想定と違う。--baseline を
        # 渡していて、それが読めない/壊れている場合も含む)。
        #
        # 🔴 **`--baseline` を渡す。**「⛔ 門にしない」と「⛔ 基準値と比べない」は
        # 別のことである——差分を Job Summary に出すのは ADR 0088 §3、相違では落とさない
        # のは同 ADR「決めたこと」4番・§2.1 である（両方を同時にやっている）。基準値が
        # コミットされているのに誰も比べないなら、
        # 値が動いても誰も気づかず、誰も基準値を更新せず、⟹ 新しい値が PR の diff に
        # 現れる輪が閉じない（ADR 0094 §8 / ADR 0088 §3 が名指しした形の再発）。
        # 一致していれば1行で黙り、違うときだけ展開する。
        #
        # ⚠ `status: "weights_unavailable"` のときは、--baseline を渡していても
        # 比較を1つも出さない——⛔ 「測れなかった」を「基準値と違う」に化けさせない。
        if: always()
        run: |
          node scripts/identifier-probe-summary.mjs \
            --measured "${{ github.workspace }}/identifier-probe.json" \
            --baseline examples/chat/identifier-probe-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identifier-probe
          path: ${{ github.workspace }}/identifier-probe.json
          if-no-files-found: ignore

  association-probes:
    name: "連想枠（ADR 0151 / Issue #291）が想起の質を動かすかを @mnemora/local-embedding で実測し、値を残す"
    runs-on: ubuntu-latest
    # Issue #291。`identifier-probes` ジョブ(#109)と同じ体裁を踏襲する——
    # `retrieval-quality`/`identifier-probes` が確立した「実測値を Job Summary へ残す・
    # 落とすのは bench 自体が壊れたときだけ」という形(ADR 0088)。
    #
    # 🔴 **このジョブは門ではない。**probe は12件(ブリッジ語の字種3カテゴリ×4件)であり、
    # [ADR 0033](../../docs/decisions/0033-what-decided-the-rank-in-the-retrieval-bench.md)
    # §3 の規律(標本7件からは失敗率も成功率も統計的に主張しない)に照らして、
    # 閾値判定に足る母数ではない——`identifier-probes`/`retrieval-quality` と同じ判断。
    # 相違があっても summary ステップは exit 0 のままである
    # (`scripts/association-summary.mjs` 参照)。
    #
    # ⚠ **`continue-on-error: true` にしない。**`identifier-probes` と同じ規律で、
    # モデル重みを取得できない・bench 自体が例外を投げる、といった run はこのジョブ
    # 自体が赤くなることを仕様とする。後続の summary/artifact ステップだけを
    # `if: always()` で必ず走らせ、可能な範囲の情報を残す。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # `LocalEmbeddingProvider` はモデル重みの取得先を選ぶ鍵を要求しない
      # (`@mnemora/local-embedding` は外部サービスへ繋がない、ADR 0085)——
      # `MNEMORA_PROVIDER_SOURCE`/`OPENAI_API_KEY` はこのジョブに関係が無い
      # (`identifier-probes` ジョブと同じ理由)。この bench の LLM 側は
      # `deterministic` 固定であり(埋め込みだけが `local`)、そちらも鍵を要求しない。
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # 🔴 以前この6箇所は `local-embedding-ruri-v3-30m-q8-v1` という**手で版を振った
        # 固定文字列**で、revision も hash も入っていなかった ⟹ **HF の `main` が動いても、
        # 誰かが `-v1` を手で上げるまで CI は古い重みを配り続けた**（Issue #564）。
        #
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        # revision は `scripts/local-embedding-pinned-revision.json`
        # （Issue #597 案(a)の唯一の宣言）から読む——**この段はもう Hugging Face に
        # 問い合わせない**（ADR 0263 追記。以前は毎回 HF の `main` の sha を引いていた）。
        #
        # ⚠ **この宣言が古くなっていないかを見張るのは、この段ではない。**
        # `check-local-embedding-fingerprint.mjs`（下の「⭐ 門」ステップ）が
        # 引き続き `main` を照合する番犬として残る——上流の `main` が動いて門が
        # 赤くなったら、それがこの宣言を更新せよという合図になる（ADR 0253 追記）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（identifier-probes と同じ key を共有する）
        # 🔴 **`identifier-probes` ジョブが使うキャッシュキー
        # (`local-embedding-ruri-v3-30m-q8-v1`)をそのまま共有する。**同じモデル
        # (ruri-v3-30m)・同じ dtype(q8)を読むだけであり、ジョブごとに別キーへ
        # 分ける理由が無い——同じ重みを2回落とすのは、CI 時間の浪費であり
        # HF 側への不要な負荷でもある。GitHub Actions のキャッシュはジョブを
        # またいで共有されるので、`identifier-probes` が先に走って作ったキャッシュを
        # このジョブが読める(逆にこのジョブが先に走ればこちらが作る)。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: "連想枠(Issue #291)を @mnemora/local-embedding で実測する"
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である。後続の summary/artifact
        # ステップだけを `if: always()` で必ず走らせる。
        env:
          MNEMORA_ASSOCIATION_JSON: ${{ github.workspace }}/association-probe.json
          MNEMORA_EMBEDDING: local
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: pnpm --filter @mnemora/example-chat run association-probes

      - name: 実測値を Job Summary に残す（⛔ 門ではない）
        # このステップは常に走る(`if: always()`)——measure ステップが落ちても、
        # 可能な範囲で値を Job Summary へ出すのはこのステップの役目である。
        # `association-summary.mjs` 自体は「入力そのものが壊れている」ときだけ
        # 非0で終わる(JSON が読めない/parse できない/形が想定と違う)。
        #
        # ⚠ **まだ `--baseline` を渡していない。**
        # `examples/chat/association-baseline.json` はまだ存在しない——このベンチは
        # CI で1度も実測されておらず、基準値の数字をでっち上げずに置けるものが無い
        # (判断の詳細は Issue #291 の PR 本文/報告)。実測が積み上がり、基準値を
        # 手作業で作れるようになったら、このステップに `--baseline` を足すこと
        # (`identifier-probes` ジョブと同じ形)。
        if: always()
        run: |
          node scripts/association-summary.mjs \
            --measured "${{ github.workspace }}/association-probe.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: association-probe
          path: ${{ github.workspace }}/association-probe.json
          if-no-files-found: ignore

  consolidation-cost:
    name: "Runtime.consolidate() が「載る量」に効くかを実測し、値を残す（Issue #136）"
