name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # git の履歴を読むテスト（adr-index-freshness など）が shallow checkout で
          # 通るかは確かめていないため、残している。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: "公開 API 表面の破壊的変更を検出する門（Issue #342 / ADR 0178）"
        run: pnpm run api:check

      - name: "配布物（packages/*/dist）が CommonJS として構文解析できること（Issue #110）"
        run: pnpm run check:cjs-parse

      - name: "文書の印付きコード片（```ts check）が今の公開 API で型検査に通ること（ADR 0345）"
        run: pnpm run check:doc-snippets

      - name: "出荷済みの migration が書き換えられていないこと（checksum の固定、ADR 0637）"
        run: pnpm run check:migration-checksums

      - name: "publish 梱包の門（pack:check）を毎PRのCIでも走らせる（Issue #241）"
        # このジョブに足す（独立ジョブにしない）理由: pack:check は各 publish
        # 対象パッケージの `prepack`（`tsc -p tsconfig.build.json`）を経由して
        # 自分で dist を作り直す（scripts/check-publish-pack.mjs 冒頭のコメント）ため、
        # 直前の Build ステップの成果物に依存しない。だから独立ジョブにしても
        # チェックアウト・install・build を丸ごとやり直すだけで意味が薄く、
        # このジョブの末尾に1ステップ足すほうが CI 時間の増分が小さい。
        # また、このジョブ名（`typecheck / lint / test / build`）は branch
        # protection の required_status_checks に登録された文字列そのものである
        run: pnpm run pack:check

      - name: "北極星7項目・既定差分の一覧を印字する（⛔ 門ではない。常に exit 0。Issue #387 / ADR 0216 決定7 段1）"
        # `continue-on-error: true` にする理由: scripts/north-star-default-probe.mjs
        # 自体は個々の観測を try/catch で包み常に exit 0 を返す設計だが、想定外の失敗
        # （例: import 解決そのものが壊れる）でこのジョブ全体を巻き込んで赤くしない
        # ための二重の安全弁。
        continue-on-error: true
        run: node scripts/north-star-default-probe.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: "公開 API の破壊的変更候補を印字する（⛔ 門ではない。常に exit 0。Issue #818 / #811 / #813 / #815）"
        # 既定引数のまま（`--base v1.0.0`、`--head` 省略＝このジョブがチェックアウトした
        # 作業ツリー）で実行する——`git show <ref>:<path>` で snapshot を取るため、
        # 冒頭の Checkout ステップの `fetch-depth: 0`（タグ `v1.0.0` を含む全履歴）に依存する。
        # `continue-on-error: true` にする理由は北極星ステップと同じ——この道具自身は
        # 個々のパッケージの読み取りを try/catch で包み常に exit 0 を返す設計だが、
        # 想定外の失敗でこのジョブ全体を巻き込んで赤くしないための二重の安全弁。
        continue-on-error: true
        run: node scripts/public-api-breaking-diff.mjs >> "$GITHUB_STEP_SUMMARY"

  postgres:
    name: packages/postgres (本物の Postgres + pgvector, server_encoding=${{ matrix.serverEncoding }})
    runs-on: ubuntu-latest
    # `fail-fast: false` を必ず付ける: SQL_ASCII 脚が落ちても UTF8 脚の証拠(artifact/
    # Job Summary)を残すため。⛔ 他5本の pgvector ジョブは matrix にしない
    strategy:
      fail-fast: false
      matrix:
        include:
          - serverEncoding: UTF8
            initdbArgs: "--encoding=UTF8"
          # `--locale=C` が要る——initdb は encoding とロケールの整合を検査するので、
          # SQL_ASCII だけを渡すと既定ロケール(実測 en_US.utf8)と噛み合わずに
          # コンテナの起動ごと落ちうる(それ自体が「POSTGRES_INITDB_ARGS が効いている」
          # という答えである。Issue #155 満たすべきこと5)。
          - serverEncoding: SQL_ASCII
            initdbArgs: "--encoding=SQL_ASCII --locale=C"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: ${{ matrix.initdbArgs }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Typecheck @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: Run postgres conformance / EXPLAIN / ADR 0011 tests against the real database
        env:
          MNEMORA_LEXICAL_REGIME_JSON: ${{ github.workspace }}/lexical-regime.json
        run: pnpm --filter @mnemora/postgres run test:db

      - name: "実測した regime を Job Summary に残す(⛔ 値の良し悪しの門ではない。ただし宣言と実測の食い違いは門である。Issue #148 ②)"
        # このステップは常に走る(`if: always()`)——上の test:db が(regime とは無関係な
        # 理由も含め)落ちても、その run で regime を書けていたかどうかを Job Summary
        # から読めるようにする。`lexical-regime-summary.mjs` 自体は server_encoding /
        if: always()
        run: |
          node scripts/lexical-regime-summary.mjs \
            --measured "${{ github.workspace }}/lexical-regime.json" \
            --expect-encoding "${{ matrix.serverEncoding }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "実測値そのもの(機械可読)を成果物として残す(Issue #148/#155)"
        # 分けないと2脚が同じ名前へ upload しようとして衝突・上書きする
        # (Issue #155 満たすべきこと1)。
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lexical-regime-${{ matrix.serverEncoding }}
          path: ${{ github.workspace }}/lexical-regime.json
          if-no-files-found: ignore

      - name: Build @mnemora/postgres
        run: pnpm --filter @mnemora/postgres run build

  postgres-regime-coverage:
    # ⚠ クォートが要る: YAML は `空白 + #` をコメントの開始として読むので、
    # 引用符なしだと check の名前が `…を測る(Issue` で**黙って切れる**
    name: "両方の server_encoding regime が実際に走ったことを測る (Issue #155)"
    needs: postgres
    # 🔴 `postgres` ジョブ(matrix)の一部の脚が落ちても、このジョブは必ず走る——
    # 「揃って別々に走ったか」を測れるだけの artifact は、失敗した run にも残りうる
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: postgres ジョブ(matrix)が skip されていないこと(⛔ skip を成功として読ませない)
        # ⚠ ここで見るのは "skipped" だけである。"failure"(片脚が落ちた)はこの
        # チェックを通す——落ちた脚の artifact が残っていれば、次の段で判定できる。
        run: |
          if [ "${{ needs.postgres.result }}" = "skipped" ]; then
            echo "postgres ジョブ(matrix)が skip された。両方の regime が実際に走ったかを" >&2
            echo "測れない——これは意図した失敗である(skip を成功として読ませないため、Issue #155)。" >&2
            exit 1
          fi

      - name: 両脚が残した lexical-regime-* artifact を全部ダウンロードする
        uses: actions/download-artifact@v6
        with:
          pattern: lexical-regime-*
          path: ${{ github.workspace }}/lexical-regime-artifacts

      - name: 両方の regime が実際に走ったかを判定する(⛔ 値の良し悪しではなく「揃って別々に走ったか」の門)
        run: |
          node scripts/lexical-regime-coverage.mjs \
            --artifacts-dir "${{ github.workspace }}/lexical-regime-artifacts" \
            >> "$GITHUB_STEP_SUMMARY"

  bullmq:
    name: "packages/bullmq（本物の Postgres + 本物の Redis）"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: "複数プロセス同時 tick が outbox ジョブを二重処理しないことを、本物の Postgres + 本物の Redis に対して検査する（ADR 0325）"
        # `packages/bullmq` の `test:redis` はマイグレーションも自前で行う
        # （`concurrent-tick.redis.test.ts` の `beforeAll` が `runMigrations`/
        # `registerEmbeddingSpace` を直接呼ぶ）——`@mnemora/postgres` の
        # `migrate` スクリプトを別途ここで叩く必要は無い。
        # ⚠ `@mnemora/core`/`@mnemora/postgres` を事前に `build` する必要も無い——
        # この歯（親プロセス・子プロセスとも）は両パッケージの `src` を相対 import /
        # vitest alias で直接読む（`concurrent-tick-child.ts` 冒頭のコメント参照。
        # 変異試験でビルドを挟まずに済ませるための意図的な設計）。
        run: pnpm --filter @mnemora/bullmq run test:redis

  cjs-require-smoke:
    # 既存の `scripts/check-consumer-install.mjs`（ADR 0346）は同じ約束をより広い範囲
    # （型・ESM 経路・入口一覧の突き合わせも）で確かめるが、npm registry から約550MB を
    # 取り直し・ロックファイル無しで依存の範囲を解決するため、既定の CI には入れていない
    # （リリース前に人が打つ。`docs/release-v1.md` 0.11）。**このジョブは registry に一切
    # 出ない設計（`scripts/check-cjs-require-smoke.mjs`）にすることで、その理由を外し、
    # CJS の `require(esm)` の一点だけを毎 PR で見る。**
    name: "CommonJS から require(esm) で読み込めること（README の前提、ADR 0387）"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        # README の約束が要求する最低版（22.12）以上であること。`scripts/check-cjs-require-smoke.mjs`
        # 自身も `process.version` を見て 22.12 未満なら実行前に赤で止まる（二重の安全弁）。
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: "CommonJS の require(esm) だけを、registry に出ずに確かめる（ADR 0387）"
        run: pnpm run check:cjs-require-smoke

  example-chat:
    # 🔴🔴 ⛔ 直上の `name:` は変えない —— この文字列は branch protection の
    # required status check の*文脈名*そのものである【実測、2026-09-23】:
    #   gh api repos/takecchi/mnemora/branches/main/protection/required_status_checks
    # の `contexts`（6件）に、この文字列が逐語で入っている。ここを書き換えると
    # required check が「見つからない」状態になり、branch protection 側の設定変更
    # （オーナー領分）が要る。
    name: examples/chat (本物の Postgres + pgvector、擬似 provider)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # 🔑 `identifier-probes`/`consolidation-cost`/`root-gate-db-stage` と
      # **同じキー空間を意図的に共有する**(下の cache 段の `key` を参照。同じモデル
      # `sirasagi62/ruri-v3-30m-ONNX` を使うため分ける理由が無い)。
      MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Typecheck examples/chat
        run: pnpm --filter @mnemora/example-chat run typecheck

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 🔴 ⛔ これは「取りに行く頻度」を下げる変更であって、「取れなかったときの
        # 倒れ方」は変えていない。リトライ・フォールバック・既定値・skip は
        # 入れていない——重みがキャッシュにも Hugging Face にも無ければ、
        # 次の test:db ステップは従来どおり赤くなる。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: "復元した model キャッシュのファイルの一覧を出す（読むだけ。門ではない。Issue #1004）"
        # 🔴 失敗させない（`|| true`）。warm のはずの cache が tokenizer_config.json を欠いているかを、CI の出力で確かめるためだけにある
        if: always()
        run: |
          find "${{ github.workspace }}/.cache/local-embedding" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true
          # transformers.js の既定のキャッシュ（読み込みの前段の確認は、cacheDir ではなくここだけを見る。Issue #1004）
          DEFAULT_CACHE_DIR="$(node scripts/print-transformers-default-cache-dir.mjs --plain 2>/dev/null || true)"
          echo "既定のキャッシュ: ${DEFAULT_CACHE_DIR:-（場所を確かめられなかった）}"
          [ -n "${DEFAULT_CACHE_DIR}" ] && find "${DEFAULT_CACHE_DIR}" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true

      - name: "温めたキャッシュだけで local の埋め込みを読み込めるかを確かめる（ネットワークへは出さない。測るだけ。Issue #1004）"
        # 🔴 失敗させない（スクリプト自身が終了コード 0 で終わり、さらに `|| true`）。出力は1行（requests=HF へ出ようとした回数）。
        run: pnpm --filter @mnemora/example-chat exec tsx src/scripts/local-embedding-offline-load-check.ts || true

      - name: Run examples/chat の observe→recall 往復・量の比較テストを本物の DB に対して実行
        run: pnpm --filter @mnemora/example-chat run test:db

      - name: local-embedding が実際に読み込んだ重みファイルは、宣言された Hugging Face repo が今まさに持っているものと一致しているか(⭐ 門)
        # ⛔ `continue-on-error: true` は使わない——それだと exit 1(不一致)まで
        # 素通りしてしまい、この段が門でなくなる。
        # 🔴 exit 2(保留)だけはジョブを落とさない——落とすと exit 1(赤)と区別が
        # 付かなくなる(スクリプト側の判定表が空文になる)。だから shell 側で終了コードを
        # 見て分岐する(`publish.yml` の `set +e` → `STATUS=$?` → `set -e` と同じ形。
        # ci.yml の shell は既定の `bash -e` である——ADR 0245)。
        env:
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: |
          set +e
          node scripts/check-local-embedding-fingerprint.mjs \
            --cache-dir "${MNEMORA_LOCAL_EMBEDDING_CACHE_DIR}"
          CODE=$?
          set -e
          case "${CODE}" in
            0)
              echo "🟢 local-embedding fingerprint: 宣言された repo の内容と一致した" >> "$GITHUB_STEP_SUMMARY"
              ;;
            2)
              echo "::warning::local-embedding fingerprint の判定を保留した(Hugging Face API に届かなかった)——一致も不一致も確認していない。"
              echo "🟡 local-embedding fingerprint: 判定していない(Hugging Face API に届かなかった。上の warning 参照)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              exit "${CODE}"
              ;;
          esac

      - name: "固定入力に対する embedding 出力を測り、sha256・次元数・lscpu を残す(測るだけ、門にはしない。Issue #565 / ADR 0253 追記)"
        # ⚠ **2つのコマンドを順に走らせるが、片方が失敗しても後段を必ず試す**
        # (`local-embedding が実際に読み込んだ重み...` ステップと同じ
        # `set +e`/`STATUS=$?`/`set -e` の形、ADR 0245)。重みを取得できなかった
        # (embedding-fingerprint が exit 1)場合でも、その事実を測定 JSON へ
        # 残すところまでは行う——ただし段全体の exit code は最初のコマンドの
        # 失敗を引き継ぐ(このジョブが赤くなること自体は仕様。identifier-probes
        # ジョブ等と同じ規律)。
        env:
          MNEMORA_EMBEDDING_FINGERPRINT_RAW_JSON: ${{ github.workspace }}/embedding-fingerprint-raw.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
        run: |
          set +e
          pnpm --filter @mnemora/example-chat run embedding-fingerprint
          EMBED_STATUS=$?
          node scripts/measure-embedding-output-fingerprint.mjs \
            --raw "${{ github.workspace }}/embedding-fingerprint-raw.json" \
            --out "${{ github.workspace }}/embedding-fingerprint.json" \
            --runner-name "${{ runner.name }}"
          MEASURE_STATUS=$?
          set -e
          if [ "${EMBED_STATUS}" -ne 0 ]; then
            exit "${EMBED_STATUS}"
          fi
          exit "${MEASURE_STATUS}"

      - name: "実測値を Job Summary に残す(⛔ 門ではない。Issue #565)"
        if: always()
        run: |
          node scripts/embedding-output-fingerprint-summary.mjs \
            --measured "${{ github.workspace }}/embedding-fingerprint.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "固定入力の embedding 出力の指紋を成果物として残す(Issue #565)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: embedding-output-fingerprint-example-chat
          path: ${{ github.workspace }}/embedding-fingerprint.json
          if-no-files-found: ignore

      - name: "correction サブコマンド(cli.ts の dispatch 行)を実際に実行し、recall 段3(矛盾の解決と必須の同伴取得)が本番経路で発火することを CI が判定する(Issue #374 / ADR 0190)"
        # provider は `deterministic`(明示 override 無し、OPENAI_API_KEY 無し)。
        # `recorded` にしない理由: `examples/chat/cassettes/` に correction 用の
        # 記録が無く、`recorded` は記録に無い入力を例外にする(ADR 0051)。
        # このデモが確かめる性質(mandatory companion retrieval・
        # resolveContested のフィルタ)はスコアの質に依存しない構造的な検査なので
        # `deterministic` で足りる(`examples/chat/src/cli.ts` の `runCorrection()`
        # doc コメント参照)。
        run: pnpm --filter @mnemora/example-chat run correction

      - name: 北極星の物差し（会話ログを全部積むのをやめてもどれだけ削れたか・冒頭の事実の出典に到達できるか）を compare で実測しログに残す
        env:
          MNEMORA_COMPARE_JSON: ${{ github.workspace }}/compare.json
        run: pnpm --filter @mnemora/example-chat run compare

      - name: 北極星の物差しが基準値から悪化していないかを判定する（⭐ 門。ADR 0133）
        # 🔴 さらに Issue #477 から、**実測と基準値の turnCount 集合が一致しない**
        # （比較していない会話長が在る）ときは exit 2（判定不能）で非0になる
        # ——「比較していない」を「退行が無い」と同じ顔で緑にしないためである。
        # このステップは常に走る
        # （`if: always()`）——`compare` 自体が壊れて JSON を書けなかった場合も、
        # その理由を Job Summary に残す。
        if: always()
        run: |
          node scripts/compare-summary.mjs \
            --measured "${{ github.workspace }}/compare.json" \
            --baseline examples/chat/compare-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: compare の実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: compare
          path: ${{ github.workspace }}/compare.json
          if-no-files-found: ignore

      - name: recall-footprint 較正の補助標本（limit=20の8点、#340 フォローアップ・ADR 0314）を生成する
        # `compare-baseline.json`（⭐門）とは別物である——`rows` には混ぜない
        env:
          MNEMORA_RECALL_FOOTPRINT_CALIBRATION_SAMPLES_JSON: ${{ github.workspace }}/recall-footprint-calibration-samples.json
        run: pnpm --filter @mnemora/example-chat run recall-footprint-calibration-samples

      - name: 較正標本の8点を Job Summary に残す（⛔ 門ではない。相違があっても exit 0、ADR 0314 §2）
        if: always()
        run: |
          node scripts/recall-footprint-calibration-samples-summary.mjs \
            --measured "${{ github.workspace }}/recall-footprint-calibration-samples.json" \
            --baseline examples/chat/recall-footprint-calibration-samples-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: recall-footprint 較正の補助標本の実測値そのもの（機械可読、生の index を含む）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recall-footprint-calibration-samples
          path: ${{ github.workspace }}/recall-footprint-calibration-samples.json
          if-no-files-found: ignore

      - name: "RecallQuery.timeWeighting（legacy/eventAwareFreshness、Issue #690・ADR 0300）を answer-time-weighting で再生し、正誤の表をログへ残す"
        # 🔴 既知の取り引き（ADR 0300）: `reinforced-fact-vs-fresh-weak` 類型は
        # legacy が構造的に失敗し eventAwareFreshness が直す——この表にもその非対称が
        # そのまま出る。隠さない。
        env:
          MNEMORA_TIME_WEIGHTING_JSON: ${{ github.workspace }}/answer-time-weighting.json
        run: pnpm --filter @mnemora/example-chat run answer-time-weighting

      - name: answer-time-weighting の実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: answer-time-weighting
          path: ${{ github.workspace }}/answer-time-weighting.json
          if-no-files-found: ignore

  root-gate-db-stage:
    name: ルートの test 門の DB 段（DATABASE_URL 在りで順方向に実測、ADR 0015）
    runs-on: ubuntu-latest
    # `pnpm run test` 全体ではなく DB 段だけを直接呼ぶ: 型検査・lint・format・
    # 各パッケージの単体テスト・build は `build` ジョブがすでに測っており、
    # ここで二重に走らせて時間を伸ばさない。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # 🔑 `identifier-probes`/`consolidation-cost` と**同じキー空間を意図的に
      # 共有する**(下の cache 段の `key` を参照。同じモデル
      # `sirasagi62/ruri-v3-30m-ONNX` を使うため分ける理由が無い)。
      MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Build @mnemora/core (postgres package depends on it)
        run: pnpm --filter @mnemora/core run build

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # 🔴 ⛔ これは「取りに行く頻度」を下げる変更であって、「取れなかったときの
        # 倒れ方」は変えていない。リトライ・フォールバック・既定値・skip は
        # 入れていない——重みがキャッシュにも Hugging Face にも無ければ、
        # このジョブは従来どおり赤くなる。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: "復元した model キャッシュのファイルの一覧を出す（読むだけ。門ではない。Issue #1004）"
        # 🔴 失敗させない（`|| true`）。warm のはずの cache が tokenizer_config.json を欠いているかを、CI の出力で確かめるためだけにある
        if: always()
        run: |
          find "${{ github.workspace }}/.cache/local-embedding" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true
          # transformers.js の既定のキャッシュ（読み込みの前段の確認は、cacheDir ではなくここだけを見る。Issue #1004）
          DEFAULT_CACHE_DIR="$(node scripts/print-transformers-default-cache-dir.mjs --plain 2>/dev/null || true)"
          echo "既定のキャッシュ: ${DEFAULT_CACHE_DIR:-（場所を確かめられなかった）}"
          [ -n "${DEFAULT_CACHE_DIR}" ] && find "${DEFAULT_CACHE_DIR}" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true

      - name: ルートの門の DB 段を DATABASE_URL 在りで通す（順方向の実測）
        # `@mnemora/postgres` の test:db は、この段では走らせない（ADR 0015 の 2026-09-28 追記）。
        # 同じ集合（同じコマンド・同じファイル・同じ DB の作り）を `postgres` ジョブの2つ
        # （server_encoding=UTF8・SQL_ASCII、どちらも required）が走らせている。この段で3回目を
        # 走らせていたのが、このジョブを最長にしていた。門は外したものを名前で出す（下の grep）。
        env:
          MNEMORA_DB_TESTS_SKIP: "@mnemora/postgres"
        run: |
          set -euo pipefail
          node scripts/run-db-tests.mjs 2>&1 | tee gate.log
          grep -F "DB テストを実行します" gate.log
          grep -F "この段では実行していない: @mnemora/postgres" gate.log
          grep -E "接続先: PostgreSQL [0-9]+" gate.log
          if grep -F "検証されていない版です" gate.log; then
            echo "CI の Postgres が検証済み一覧から外れている（VERIFIED_MAJOR_VERSIONS を見直すこと）" >&2
            exit 1
          fi
          grep -F "✔ DB テストも実行し、通りました。" gate.log
          if grep -F "DB テストは実行していません" gate.log; then
            echo "DB 段が未実行の側へ落ちた" >&2
            exit 1
          fi

      - name: "固定入力に対する embedding 出力を測り、sha256・次元数・lscpu を残す(測るだけ、門にはしない。Issue #565 / ADR 0253 追記)"
        env:
          MNEMORA_EMBEDDING_FINGERPRINT_RAW_JSON: ${{ github.workspace }}/embedding-fingerprint-raw.json
        run: |
          set +e
          pnpm --filter @mnemora/example-chat run embedding-fingerprint
          EMBED_STATUS=$?
          node scripts/measure-embedding-output-fingerprint.mjs \
            --raw "${{ github.workspace }}/embedding-fingerprint-raw.json" \
            --out "${{ github.workspace }}/embedding-fingerprint.json" \
            --runner-name "${{ runner.name }}"
          MEASURE_STATUS=$?
          set -e
          if [ "${EMBED_STATUS}" -ne 0 ]; then
            exit "${EMBED_STATUS}"
          fi
          exit "${MEASURE_STATUS}"

      - name: "実測値を Job Summary に残す(⛔ 門ではない。Issue #565)"
        if: always()
        run: |
          node scripts/embedding-output-fingerprint-summary.mjs \
            --measured "${{ github.workspace }}/embedding-fingerprint.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "固定入力の embedding 出力の指紋を成果物として残す(Issue #565)"
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: embedding-output-fingerprint-root-gate-db-stage
          path: ${{ github.workspace }}/embedding-fingerprint.json
          if-no-files-found: ignore

  embedding-output-fingerprint-compare:
    name: "固定入力に対する embedding 出力の指紋を2ジョブ間で突き合わせる(測るだけ。門にはしない。Issue #565 / ADR 0253 追記)"
    needs: [example-chat, root-gate-db-stage]
    # 🔴 `postgres-regime-coverage` ジョブと同じ理由——`example-chat` /
    # `root-gate-db-stage` のどちらかが(重み取得失敗などで)落ちても、
    # このジョブは必ず走る。落ちた側の artifact が無ければ
    # `compare-embedding-output-fingerprints.mjs` が「比較できなかった」と
    # 名乗るだけであり(一致とも不一致とも言わない)、それ自体はこのジョブを
    # 落とさない(⛔ 門ではない)。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: "両ジョブが残した embedding-output-fingerprint-* artifact を集める(無ければ無いまま——このジョブは落とさない。Issue #565)"
        uses: actions/download-artifact@v6
        with:
          pattern: embedding-output-fingerprint-*
          path: ${{ github.workspace }}/embedding-fingerprint-artifacts

      - name: "2ジョブの指紋を突き合わせ、一致・不一致・比較できなかったを Job Summary に残す(⛔ 門ではない。常に exit 0。Issue #565)"
        run: |
          node scripts/compare-embedding-output-fingerprints.mjs \
            --artifacts-dir "${{ github.workspace }}/embedding-fingerprint-artifacts" \
            >> "$GITHUB_STEP_SUMMARY"

  retrieval-quality:
    name: 想起の質を実 embedding（記録の再生）で実測し、値を残す（ADR 0088）
    runs-on: ubuntu-latest
    # ⛔ **このジョブは門ではない。**基準値と違っても落ちない。
    # 落ちるのは bench そのものが壊れたときだけ（カセットに無い入力・DB エラー・
    # 出力が壊れている）。理由は ADR 0088 §2:
    #   - decay/freshness は時刻に依存し、実行ごとに実際に揺れる（total の6桁目が動く）。
    #     見出しの数字が安定するのは similarity の変域が decay の約 10^6 倍だからで、
    #     「2 回一致した」は決定性の証明ではない。偽陽性率に上限を置けない。
    #   - 標本は probe 7 件しかない（ADR 0033 §3）。閾値の門は偽陽性を出す。
    timeout-minutes: 20
    # ⚠ この repo は timeout-minutes を1箇所も設定しておらず、既定は 360 分である。
    # bench 自体は数秒で終わる（手元の実測で 4.9 秒）。刺さったときに6時間燃やさない
    # ためだけの上限であり、**この1ジョブにだけ付けている**（既存ジョブへ一斉に
    # 付けるのは ADR 0088 の範囲外）。
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # ⭐ **明示する。**CI には OPENAI_API_KEY が無いので既定でも recorded に落ちるが、
      # 既定に頼ると「いつか鍵が入った日」に、このジョブが黙って実 API を叩き始める
      # （decideProviderSource の既定は「キーが在れば実 API」）。ADR 0068 が
      # この明示指定を足したのは、まさにその口を塞ぐためである。
      MNEMORA_PROVIDER_SOURCE: recorded
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: 想起の質を実 embedding（記録の再生）で実測する
        # `retrieval` は DATABASE_URL を要求し、擬似物へ黙ってフォールバックしない
        # （requireDatabaseUrl）。arm を選ぶ口は無いので A/B/C の3本すべてが走る——
        # ⚠ arm A（擬似LLM+擬似埋め込み）の MRR 0.018 は実質ランダムであり、
        # これを「引けた」と読んではいけない（ADR 0022 / AGENTS.md）。
        env:
          MNEMORA_RETRIEVAL_JSON: ${{ github.workspace }}/retrieval-quality.json
        run: pnpm --filter @mnemora/example-chat run retrieval

      - name: 実測値と基準値の差分を Job Summary に残す（⛔ 門ではない）
        # このステップは基準値との相違では落ちない（exit 0）。入力そのものが
        # 壊れているときだけ非0で落ちる。ADR 0088 §2.1。
        run: |
          node scripts/retrieval-quality-summary.mjs \
            --measured "${{ github.workspace }}/retrieval-quality.json" \
            --baseline examples/chat/retrieval-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-quality
          path: retrieval-quality.json
          if-no-files-found: ignore

  retrieval-rank-listing:
    name: "固定回帰ケースと同じ条件で probe ごとの順位を一覧にする（Issue #572、ADR 0276 追記。⛔ 門ではない）"
    runs-on: ubuntu-latest
    # ⛔ **このジョブは門ではない。**
    #   - 順位がどうであっても落ちない。落ちるのは bench が壊れて一覧を作れないとき
    #     （例外・全 probe で候補が0件・probe の件数が合わない）だけ（`decideRankListingExit`）。
    #   - `.github/required-status-checks.json` に入れない。どのジョブの `needs` にも入れない。
    #     `scripts/__tests__/ci-yml-retrieval-rank-listing-wiring.test.mjs` がこの2つを固定する。
    #   - 基準値とは比べない（順位を焼き込まない）。前の値は前の run の成果物で見ること。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
      # 明示する（`retrieval-quality` ジョブと同じ理由。ADR 0068）。スクリプト自身も
      # `MNEMORA_LLM`/`MNEMORA_EMBEDDING` を recorded に固定して渡す。
      MNEMORA_PROVIDER_SOURCE: recorded
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: probe ごとの順位を一覧にして Job Summary に残す（⛔ 門ではない）
        env:
          MNEMORA_RANK_LISTING_JSON: ${{ github.workspace }}/retrieval-rank-listing.json
        run: pnpm --silent --filter @mnemora/example-chat run retrieval-rank-listing >> "$GITHUB_STEP_SUMMARY"

      - name: 一覧そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-rank-listing
          path: retrieval-rank-listing.json
          if-no-files-found: ignore

  identifier-probes:
    name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測し、値を残す
    runs-on: ubuntu-latest
    # ⚠ **なぜ閾値の門にしないか**: ADR 0088 が `retrieval-quality` について
    # 「標本7件では偽陽性を出す」として明示的に採らなかったのと同じ理由——この bench の
    # probe は30件(識別子)・12件(日本語)であり(ADR 0094 追記 / PR #191 / PR #192)、
    # ADR 0033 §3 の規律に照らして統計的な閾値判定に足る母数ではない。probe を増やした後、
    # 別途測ってから決める段取りである。
    # 🔴 **ただし「重みを取得できなかった」ときは、このジョブ自体を意図して失敗させる**
    # ——`identifier-probes` サブコマンドは `warmup()` が失敗したらメトリクスを1件も
    # 出さずに `process.exitCode = 1` で終わる仕様であり(`local-embedding-warmup.ts`)、
    # それをこのジョブでも尊重する(揉み消さない)。measure ステップが失敗しても、
    # 後続の summary/artifact ステップは `if: always()` で必ず走り、「重みが取得
    # できなかった」ことを Job Summary に明示する(`buildSummaryMarkdown` の
    # `weights_unavailable` 分岐)。
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mnemora_ci
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mnemora_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable required extensions (vector / btree_gin / pgcrypto)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci -c "select 1;" \
            && PGPASSWORD=postgres psql -h localhost -U postgres -d mnemora_ci \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run migrations (packages/postgres の唯一のマイグレーション実行口)
        run: pnpm --filter @mnemora/postgres run migrate

      - name: "固定した revision（Issue #597 案(a)）から cache 鍵を決める（Issue #564 / ADR 0263 追記）"
        # ⛔ **鍵の材料をここに書かない。**repo 名も dtype も、唯一の出所である
        # `packages/local-embedding/src/local-embedding-provider.ts` の宣言から
        # スクリプトが読む（`AGENTS.md`「⚠ 数を、道具と生成物に焼き込まない」）。
        id: local-embedding-cache-key
        run: node scripts/print-local-embedding-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: モデル重みをキャッシュする（actions/cache。cacheDir を明示して場所を固定する）
        # ⚠ CI ランナーでは同じ場所とは限らない（pnpm のバージョン・store の位置に依存する）
        # ため、`MNEMORA_LOCAL_EMBEDDING_CACHE_DIR`（`examples/chat/src/providers.ts` が
        # `LocalEmbeddingProvider` の `cacheDir` オプションへそのまま渡す——**使うだけで
        # `@mnemora/local-embedding` 自体は変更していない**）で場所を明示的に固定する。
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/local-embedding
          key: local-embedding-${{steps.local-embedding-cache-key.outputs.key}}

      - name: "復元した model キャッシュのファイルの一覧を出す（読むだけ。門ではない。Issue #1004）"
        # 🔴 失敗させない（`|| true`）。warm のはずの cache が tokenizer_config.json を欠いているかを、CI の出力で確かめるためだけにある
        if: always()
        run: |
          find "${{ github.workspace }}/.cache/local-embedding" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true
          # transformers.js の既定のキャッシュ（読み込みの前段の確認は、cacheDir ではなくここだけを見る。Issue #1004）
          DEFAULT_CACHE_DIR="$(node scripts/print-transformers-default-cache-dir.mjs --plain 2>/dev/null || true)"
          echo "既定のキャッシュ: ${DEFAULT_CACHE_DIR:-（場所を確かめられなかった）}"
          [ -n "${DEFAULT_CACHE_DIR}" ] && find "${DEFAULT_CACHE_DIR}" -type f -printf "%s %P\n" 2>/dev/null | sort -k2 || true

      - name: 識別子・固有名詞 probe（#106）を @mnemora/local-embedding で実測する
        # ⚠ **`continue-on-error: true` にしない。**重みを取得できなかった run は
        # このジョブが赤くなること自体が仕様である（メトリクスを出さずに落ちる）。
        # 後続の summary/artifact ステップだけを `if: always()` で必ず走らせる。
        env:
          MNEMORA_IDENTIFIER_PROBE_JSON: ${{ github.workspace }}/identifier-probe.json
          MNEMORA_LOCAL_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/.cache/local-embedding
          MNEMORA_IDENTIFIER_PROBE_OPENAI_JSON: ${{ github.workspace }}/identifier-probe-openai.json
        run: pnpm --filter @mnemora/example-chat run identifier-probes

      - name: 実測値と基準値の差分、または「重みが取得できなかった」ことを Job Summary に残す（⛔ 門ではない）
        # 🔴 **`--baseline` を渡す。**「⛔ 門にしない」と「⛔ 基準値と比べない」は
        # 別のことである——差分を Job Summary に出すのは ADR 0088 §3、相違では落とさない
        # のは同 ADR「決めたこと」4番・§2.1 である（両方を同時にやっている）。基準値が
        # コミットされているのに誰も比べないなら、
        # 値が動いても誰も気づかず、誰も基準値を更新せず、⟹ 新しい値が PR の diff に
        # 現れる輪が閉じない（ADR 0094 §8 / ADR 0088 §3 が名指しした形の再発）。
        # 一致していれば1行で黙り、違うときだけ展開する。
        #
        # ⚠ `status: "weights_unavailable"` のときは、--baseline を渡していても
        # 比較を1つも出さない——⛔ 「測れなかった」を「基準値と違う」に化けさせない。
        if: always()
        run: |
          node scripts/identifier-probe-summary.mjs \
            --measured "${{ github.workspace }}/identifier-probe.json" \
            --baseline examples/chat/identifier-probe-baseline.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identifier-probe
          path: ${{ github.workspace }}/identifier-probe.json
          if-no-files-found: ignore

      - name: "OpenAI 実埋め込み arm（recorded 再生、Issue #109 後半）の差分と並走の判定を Job Summary に残す（⛔ 門ではない）"
        # `identifier-probe-openai.json` が無いことがある（openai arm ブロックが握った
        # 例外・カセット未整備）——`openai-arm-summary.mjs` はその場合を非0にしない
        # （doc コメント参照）。相違でも「並走の判定」が red でも exit 0 のまま。
        if: always()
        run: |
          node scripts/openai-arm-summary.mjs \
            --title "識別子・日本語固有名詞 probe（OpenAI 実埋め込み・4群）" \
            --measured "${{ github.workspace }}/identifier-probe-openai.json" \
            --baseline examples/chat/identifier-probe-baseline.openai.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: 実測値そのもの（OpenAI arm、機械可読）を成果物として残す
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: identifier-probe-openai
          path: ${{ github.workspace }}/identifier-probe-openai.json
          if-no-files-found: ignore

