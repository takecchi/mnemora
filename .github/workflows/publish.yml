name: Publish

# ⚠ このファイル名（publish.yml）は npm 側の設定と結びついている。
# Trusted Publishing の信頼発行元は「org / repo / **workflow のファイル名**」で指定するため、
# **このファイルを改名すると publish が 403 で止まる**（npmjs.com 側も直す必要がある）。

on:
  # ⚠ `push: tags` は**わざと使っていない。**Releases の UI から Release を作ると
  # tag も同時に作られるため、両方を引き金にすると**同じ版で2本走る**
  # （後から走ったほうは下の「既に上がっている版を飛ばす」に落ちて緑になるので、
  # 事故にはならないが、どちらが本物か読めなくなる）。
  # ⟹ 素の `git push origin v0.1.1` では publish されない。Release を作ること。
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "npm publish を --dry-run で打つ（registry へ何も上げない予行）"
        type: boolean
        default: true

permissions:
  contents: read

# 同じ版に対して2本が並走しないようにする（Release の編集で published が
# 再発火する場合などに備える）。cancel-in-progress は false——publish の途中で
# 殺すと「7本のうち2本だけ上がった」を作りうる。
concurrency:
  group: publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish（Trusted Publishing / OIDC）
    runs-on: ubuntu-latest

    # OIDC の id-token が無いと Trusted Publishing は使えない。
    # これが無い状態では npm が長期トークンを探し、見つからず 401 で止まる。
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 下の「tag が main の履歴上に在ること」の検査に全履歴が必要。
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # registry-url を渡すと ~/.npmrc が registry.npmjs.org を向く。
          # Trusted Publishing でもこの設定が要る（トークンは置かない）。
          registry-url: "https://registry.npmjs.org"

      - name: Update npm CLI（Trusted Publishing は npm >= 11.5.1 が必要）
        # Node 22 に同梱の npm は 10.x で、OIDC の交換を実装していない。
        # ここを飛ばすと publish は「トークンが無い」の顔をして 401 で落ちる。
        run: |
          npm install -g npm@latest
          npm --version

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release の tag が main の履歴上に在ることを確かめる
        # publish.yml は CI（ci.yml）を経由しない引き金で走る。ci.yml は
        # `push: branches: [main]` と `pull_request` にしか反応しないため、
        # **main を通っていない commit から Release を作れば、検査を1つも通らずに
        # publish に到達できてしまう。**
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          # ⚠ ここに --depth=0 を渡してはならない（git は "depth 0 is not a positive number" で
          # fatal になる。実測して確認した）。
          git fetch origin main
          TAG_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/main; then
            echo "Release の tag が指す commit (${TAG_SHA}) は origin/main の履歴上に在りません。" >&2
            echo "main へ入った commit から Release を作ってください。" >&2
            exit 1
          fi
          echo "OK: Release の tag は origin/main の履歴上に在ります（${TAG_SHA}）。"

      - name: Release の tag の版を package.json へ書き込む（ADR 0070）
        # 歯がそれを直接測る（ADR 0067 と同じ形）。semver でない tag はここで落ちる
        # ——`${TAG#v}` だけの実装だと `vfoo` が `foo` として書き込まれ、
        # `mnemora-core-foo.tgz` が publish の直前まで誰にも気づかれずに作られる。
        # ⚠ この段は install の**後**に置くこと。先に置くと `--frozen-lockfile` が
        # 書き換え後の package.json を見ることになる。
        id: version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/apply-release-version.mjs

      - name: 予行のときは package.json の版をそのまま使う
        id: version_dry_run
        if: github.event_name != 'release'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/core/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          echo "版: ${VERSION}（予行。package.json の値をそのまま使う） / dist-tag: latest"

      - name: Typecheck / Lint / Format / Test / Build（非 DB の門を全部通す）
        # DB を要する検査（packages/postgres と examples/chat の test:db）はここでは走らない
        # ——service container を立てる必要があり、同じ commit に対して main の CI が
        # すでに走っている（上の ancestor 検査がその前提を押さえている）。
        # ルートの `pnpm run test` は DB 段について「実行していません」と明示的に告知する（ADR 0015）。
        run: |
          node scripts/run-publish-gates.mjs

      - name: publish 梱包の門（tarball の中身を検査する）
        run: pnpm run pack:check

      - name: "pnpm pack（workspace: を実版へ置換できるのは pnpm だけ）"
        # 梱包は pnpm、アップロードは npm に分ける（ADR 0066）。
        # `npm pack` は `workspace:*` を tarball に残し、素の consumer の install が
        # EUNSUPPORTEDPROTOCOL で落ちる（ADR 0060 の実測）。
        run: |
          node scripts/pack-publish-targets.mjs "${RUNNER_TEMP}/tarballs" \
            --expect-version "${{ steps.version.outputs.version || steps.version_dry_run.outputs.version }}"

      - name: 予行か本番かを決める（fail-open にしない）
        # shell の文字列比較（`[ "..." = "true" ]`）で済ませない: `"true"` と一致しない
        # どんな値でも本番 publish に倒れる fail-open になるため。「危険と明示されたときだけ本番」
        # にしてあり、`dry_run` が `"true"`/`"false"` のどちらでもない値（空文字・未定義・
        # `"TRUE"`・`"1"` 等）は `::warning::` を出したうえで予行にする。
        # `dry_run` は利用者が渡す値なので `${{ }}` の直接展開ではなく `env:` 経由で渡す
        # （shell への注入面を減らすため）。
        # `github.event_name` は列挙値で安全だが、揃えて `env:` にしている。
        id: dry-run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: node scripts/decide-publish-dry-run.mjs

      - name: npm publish（依存の向きの順に、tarball を上げる）
        # `npm publish <tarball>` は解決済みの manifest を持つ tarball を上げるだけなので、
        # workspace: プロトコルを見ることが無い——ADR 0060 が塞いだ穴は開かない。
        #
        # provenance: Trusted Publishing 経由なら npm が自動で付けるが、
        # **意図を読める形で残すために明示する**。付けられない環境では
        # 黙って落ちるのではなく、このフラグが原因を名指しして落ちる。
        #
        # **⭐ 既に上がっている版は飛ばす（冪等にする）。**
        # 7本を順に上げる途中で1本落ちたとき、そのまま再実行すると
        # 「1本目が既に在る」で E403 になって**再開できない**。飛ばす形にすれば
        # 落ちた続きから再開できる。版そのものの取り違えは上の --expect-version が見ている
        # （7パッケージとも tag の版であることを確かめてから、ここへ来る）。
        #
        # **⚠ publish の成否は npm publish の出力で判断し、npm view では判断しない。**
        # registry の読み取り側は書き込みに数分遅れ、CDN を迂回する ?write=true でも
        # 404 を返すことがある（ADR 0066 測ったこと8 で実測）。だから「上がっているか」の
        # 事前判定に npm view を使うと、**上がっているのに再 publish を試みる**
        # ——それは E403 になるだけなので、下では「E403 なら上がっていたと見なす」形で受ける。
        # `DRY_RUN` / `NPM_TAG` は上の step の出力なので `env:` 経由で受ける
        # （直接展開に戻さない——今回の fail-open 修正のついでの副次的な硬化）。
        env:
          DRY_RUN: ${{ steps.dry-run.outputs.dry_run }}
          NPM_TAG: ${{ steps.version.outputs.npm_tag || steps.version_dry_run.outputs.npm_tag }}
        run: |
          set -euo pipefail
          # ⚠ NPM_TAG が空のまま `--tag ""` を渡すと、npm がどう振る舞うかはこの器で
          # 確かめていない。**確かめていないものを publish の経路に通さない**——ここで落とす。
          if [ -z "${NPM_TAG}" ]; then
            echo "::error::NPM_TAG が空です。版を決める段が走らなかった可能性があります。" >&2
            exit 1
          fi
          DRY=""
          if [ "${DRY_RUN}" = "true" ]; then
            DRY="--dry-run"
            echo "予行（--dry-run）です。registry へは何も上がりません。"
          fi
          while IFS= read -r tarball; do
            spec=$(tar xzOf "${tarball}" package/package.json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log(m.name+"@"+m.version)})')
            echo "::group::npm publish ${spec}"
            set +e
            OUT=$(npm publish "${tarball}" --access public --provenance \
              --tag "${NPM_TAG}" ${DRY} 2>&1)
            STATUS=$?
            set -e
            echo "${OUT}" | grep -v '^npm notice' || true
            if [ "${STATUS}" -eq 0 ]; then
              echo "✔ ${spec} を publish した"
            elif echo "${OUT}" | grep -q "cannot publish over the previously published"; then
              echo "✔ ${spec} は既に registry に在る（飛ばした）"
            else
              echo "✗ ${spec} の publish が失敗した（exit ${STATUS}）" >&2
              exit "${STATUS}"
            fi
            echo "::endgroup::"
          done < "${RUNNER_TEMP}/tarballs/publish-order.txt"
