name: Release follow-up notice

# 🔴 **これは門ではない。**required status check に載せない／失敗しても何も止めない。
# ⟹ 誤報しても、誰の PR も止まらない。外すときは、このファイルと
#    scripts/check-release-changelog-section.mjs を消すだけでよい。
# ⭐ この「壊れ方が可逆であること」が、採らなかった案（main の required で強制する形）
#    との唯一の線である——理由は docs/decisions/0251-release-follow-up-notice-not-a-gate.md。
#
# ⚠ publish.yml とは別ファイルにしてある。あちらのファイル名は npm の Trusted Publishing の
#   信頼発行元設定に結びついており（publish.yml 冒頭のコメント）、**リリース経路そのもの**である。
#   ⟹ 通知を足すためにあちらへ触らない。

on:
  # publish.yml と同じ引き金（Release を publish した瞬間）。
  # ⚠ publish.yml と並走するが、こちらは registry へ何もせず、読むだけである。
  release:
    types: [published]
  # 手で引き直せるようにしておく（⛔ 判定を変える入力は持たせない）。
  workflow_dispatch:
    inputs:
      tag_name:
        description: "確かめたい tag 名（例: v0.4.0）"
        type: string
        required: true

permissions:
  contents: read

jobs:
  notice:
    name: 出した版の節が CHANGELOG.md に在るかを通知する（⛔ 門ではない）
    runs-on: ubuntu-latest
    steps:
      # ⚠ tag ではなく main を取り出す。問いは「出した版の節が *いまの main に* 在るか」であり、
      #    tag の木を見ると「tag を切った時点で在ったか」という別の問いになる。
      - name: main を取り出す
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Node を用意する
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # ⚠ tag 名は env 経由で渡す（`${{ }}` を run の本文へ直に展開しない）。
      - name: 節が在るかを通知する（終了コードは常に 0）
        env:
          TAG_NAME: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: node scripts/check-release-changelog-section.mjs "$TAG_NAME"
